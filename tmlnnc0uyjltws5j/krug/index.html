// Start: Daten stehen entweder in der Seite (Demo, ein Artefakt) oder liegen als Dateien daneben (App)
function boot(){
  var el=document.getElementById('werk');
  if(el){ run(JSON.parse(el.textContent)); return }
  // Eine Folgendatei, die fehlt oder defekt ist, hält den Start nicht auf: die Folge fehlt dann wie eine, die noch kommt.
  function hol(u){ return fetch(u).then(function(r){ if(!r.ok) throw new Error(u+': '+r.status); return r.json() }) }
  hol('werk.json').then(function(W){
    return Promise.all(W.folgen.map(function(F){return (F.frei||F.vorschau) ? hol(F.datei).then(function(d){F.daten=d},function(e){ if(window.console) console.warn('Folge fehlt',e) }) : null})).then(function(){run(W)});
  }).catch(function(e){
    if(window.console) console.error(e);
    var m=document.createElement('p'); m.setAttribute('role','alert'); m.style.cssText='position:fixed;left:0;right:0;top:40%;margin:0;padding:0 24px;text-align:center;font:16px/1.4 system-ui,sans-serif;color:#fff';
    m.textContent='Das Buch konnte nicht geladen werden. Bitte später noch einmal öffnen.'; document.body.appendChild(m);
  });
}

// ===== Leser =====
function run(W){
  // Gemerktes (Lesestand, Pur, Ton, Einführung) gilt je Werk: Schlüssel mit W.id, damit sich zwei Bücher auf demselben Ursprung (App) nicht überschreiben.
  // Gelesen wird ersatzweise der alte Schlüssel ohne Werk, damit bisherige Leser ihren Stand behalten.
  function lsG(k){ try{ var v=localStorage.getItem(W.id+'-'+k); return v==null?localStorage.getItem(k):v }catch(e){ return null } }
  function lsS(k,v){ try{ localStorage.setItem(W.id+'-'+k,v) }catch(e){} }
  render(W);
  var feed=document.getElementById('feed'), bar=document.querySelector('#bar i');
  var cards=[].slice.call(document.querySelectorAll('.card'));
  var still=window.matchMedia('(prefers-reduced-motion: reduce)').matches, still0=still;
  var live=new Map();   // laufende Animationen und Timer je Karte

  function stop(card){
    var l=live.get(card); if(!l) return;
    l.anims.forEach(function(a){try{a.cancel()}catch(e){}});
    l.timers.forEach(clearTimeout); l.rafs.forEach(function(r){r.dead=true});
    var c=card.querySelector('canvas.fx'); if(c) c.getContext('2d').clearRect(0,0,c.width,c.height);
    var v=card.querySelector('video'); if(v){try{v.pause()}catch(e){} v.onended=v.onplaying=null}
    live.delete(card);
  }
  function sizeCanvas(c){
    var r=c.getBoundingClientRect(), d=Math.min(2,window.devicePixelRatio||1);
    c.width=Math.max(1,Math.round(r.width*d)); c.height=Math.max(1,Math.round(r.height*d));
    return c.getContext('2d');
  }
  // Manga-Linien: Keile, die von aussen auf einen Punkt zulaufen (Radien in Anteilen der Bildbreite)
  function burst(c,cx,cy,r0,r1,n,alpha,col){
    var g=sizeCanvas(c), W=c.width, H=c.height;
    g.clearRect(0,0,W,H); g.fillStyle=col||'rgba(0,0,0,'+alpha+')';
    for(var i=0;i<n;i++){
      var a=Math.random()*Math.PI*2, w=.004+Math.random()*.012;
      var ri=(r0+Math.random()*(r1-r0)*.5)*W, ro=(r1+Math.random()*.5)*W;
      g.beginPath();
      g.moveTo(cx*W+Math.cos(a)*ri, cy*H+Math.sin(a)*ri);
      g.lineTo(cx*W+Math.cos(a-w)*ro, cy*H+Math.sin(a-w)*ro);
      g.lineTo(cx*W+Math.cos(a+w)*ro, cy*H+Math.sin(a+w)*ro);
      g.fill();
    }
  }
  function flicker(l,c,ms,every,draw){
    var t0=performance.now(), last=0, h={dead:false}; l.rafs.push(h);
    (function tick(t){
      if(h.dead) return;
      if(t-last>every){draw(); last=t}
      if(t-t0<ms) requestAnimationFrame(tick);
      else c.getContext('2d').clearRect(0,0,c.width,c.height);
    })(t0);
  }
  function pop(el){
    if(still) return;
    el.animate(
      [{opacity:0,transform:'scale(.6) translateY(10px)'},{opacity:1,transform:'scale(1.06)',offset:.7},{opacity:1,transform:el.classList.contains('note')?'rotate(-1.5deg)':'none'}],
      {duration:320,easing:'cubic-bezier(.2,.9,.3,1.3)'});
  }
  function shake(l,el){
    l.anims.push(el.animate(
      [{transform:'translate(0,0)'},{transform:'translate(-7px,3px)'},{transform:'translate(6px,-4px)'},{transform:'translate(-4px,2px)'},{transform:'translate(0,0)'}],
      {duration:300,easing:'linear'}));
  }

  // Blasen kommen einzeln, jede auf Tippen oder Wisch. Einzige Ausnahme (Michael 15.11.): die erste Blase einer Bildkarte kommt von selbst,
  // sobald die erste Kamerafahrt fertig ist; auf Karten mit Szenenvideo sofort, während das Video schon läuft. Danach geht nichts allein weiter, auch nicht zur nächsten Karte.
  function steps(card){
    return [].filter.call(card.querySelectorAll('.step'),function(s){
      return !(s.classList.contains('note') && (document.body.classList.contains('nomerke')||document.body.classList.contains('pur')));
    });
  }
  function hint(card){
    if(card.classList.contains('bridge')){brHint(card.querySelector('.br-box')); return}
    if(!card.querySelector('.hint')) return;
    var left=steps(card).some(function(s){return s.classList.contains('wait')});
    var last=false;
    var nb=card.querySelector('.neu'), alle=steps(card);   // „Nochmal“: sobald etwas dasteht, kann man die Seite von vorn beginnen
    if(nb) nb.hidden=!alle.length||alle.every(function(s){return s.classList.contains('wait')});
    var hs=card.querySelector('.hint span'); if(!hs) return;
    hs.textContent = left ? 'Tippen für mehr' : (last ? 'Ende der Demo · Tippen startet neu' : 'Nach oben wischen ↑');
  }
  var RUTSCH={blase:true,kasten:true};   // Schalter: was beim nächsten Schritt sichtbar nach oben rutscht (false = springt ohne Bewegung an den neuen Platz)
  function next(card){
    var s=steps(card).filter(function(x){return x.classList.contains('wait')})[0];
    if(!s) return false;
    // wie im Nachrichten-Chat: was schon dasteht, rutscht schnell und sichtbar nach oben, das Neue kommt unten dazu
    var alt=still?[]:steps(card).filter(function(x){return x!==s && !x.classList.contains('wait')}).map(function(x){return [x,x.getBoundingClientRect().top]});
    s.classList.remove('wait');
    alt.forEach(function(a){var d=a[1]-a[0].getBoundingClientRect().top; if(!RUTSCH[a[0].classList.contains('bub')?'blase':'kasten']) return; if(Math.abs(d)>1) a[0].animate([{translate:'0 '+d.toFixed(1)+'px'},{translate:'0 0'}],{duration:240,easing:'cubic-bezier(.2,.8,.2,1)'})});
    pop(s); hint(card); stepCam(card,s); vzStep(card,s); return true;
  }
  function reset(card){
    [].forEach.call(card.querySelectorAll('.step'),function(s){s.classList.add('wait')});
    hint(card);
  }
  function showAll(card){
    [].forEach.call(card.querySelectorAll('.step'),function(s){s.classList.remove('wait')});
    hint(card);
  }

  // Kamera: verschiebt und vergrößert das Bild so, dass der Punkt (x%, y%) im oberen Bilddrittel steht
  function camT(card,x,y,sc){
    var st=card.querySelector('.stage'), W=st.clientWidth, H=st.clientHeight;
    var tx=Math.min(0,Math.max(W-W*sc, W*.5-x/100*W*sc)), ty=Math.min(0,Math.max(H-H*sc, H*.36-y/100*H*sc));
    return 'translate('+tx.toFixed(1)+'px,'+ty.toFixed(1)+'px) scale('+sc+')';
  }
  function camTo(l,pic,to,dur,ease,from){
    var f=from||getComputedStyle(pic).transform; if(f==='none') f='translate(0px,0px) scale(1)';
    l.anims.push(pic.animate([{transform:f},{transform:to}],{duration:dur,easing:ease,fill:'both'}));
  }
  // Mit jeder Blase fährt die Kamera zur Figur, die spricht; bei einer Pointe mit Ruck und Linien
  function stepCam(card,s){
    var l=live.get(card); if(!l||!s.dataset.f||card.dataset.k!=='g'||card.dataset.vid) return;   // Videokarte: Kamera steht
    var f=s.dataset.f.split(',').map(Number), pic=card.querySelector('.pic'), img=pic.querySelector('.lay, img'), fx=card.querySelector('canvas.fx');
    if(f[3]){
      camTo(l,pic,camT(card,f[0],f[1],f[2]),90,'steps(1,end)');
      shake(l,img); flicker(l,fx,800,70,function(){burst(fx,.5,.36,.4,.75,70,.8)});
    } else {
      // Zurückfahren (kleinerer Ausschnitt -> größerer) nie schnell: das wirkt wie ein Ruck nach der Fahrt
      var cur=1; try{cur=new DOMMatrix(getComputedStyle(pic).transform).a}catch(e){}
      var out=f[2]<cur-.05;
      camTo(l,pic,camT(card,f[0],f[1],f[2]),out?2200:900,out?'cubic-bezier(.4,0,.3,1)':'cubic-bezier(.35,0,.15,1)');
    }
  }
  function play(card){
    stop(card); if(card.dataset.done) showAll(card); else reset(card);   // schon gelesene Karte: alle Blasen gleich da (Zurückblättern ohne neues Durchtippen)
    // die Videos der nächsten Karten schon holen, damit sie ohne Warten starten
    var ci=cards.indexOf(card); cards.slice(ci,ci+4).forEach(function(c){var v=c.querySelector('.sv'); if(v&&v.preload!=='auto'){v.preload='auto'; try{v.load()}catch(e){}}});
    if(still){showAll(card); return}
    var l={anims:[],timers:[],rafs:[]}; live.set(card,l);
    var k=card.dataset.k, pic=card.querySelector('.pic'), fx=card.querySelector('canvas.fx');

    if(k==='0'){   // Titel knallt Wort für Wort herein, dann bricht ZERBROCHNE
      var ws=[].slice.call(card.querySelectorAll('.cv-title>span')), w2=card.querySelector('.w2');

    }
    var ax=e.target.closest('[data-ax]');
    if(ax){var A=W.anhang[+ax.dataset.ax], B=brueckeHtml(A,W,null), v=sheet.querySelector('[data-view="ax"]');
      v.innerHTML='<div class="br-box ax-in">'+'<p class="br-kick">Freiwillig · <b>'+B.vs+'</b></p>'+B.html+'</div>';
      brWire(v.querySelector('.br-box')); show('ax',A.titel)}
    if(f) profile(f.dataset.fig);

    if(sg){
      var id=sg.parentNode.id, v=sg.dataset.v;

      if(id==='s-fs') document.documentElement.style.setProperty('--bs',v);
      if(id==='s-move'){still=still0||v==='0'; document.body.dataset.move=v; var c=curCard(); if(c){stop(c); if(still) showAll(c); else {reset(c); play(c)}}}
      segs2();
    }
  });
  back.addEventListener('click',function(){ if(cur==='fig'){list(); show('figs','Figuren')} else if(cur==='ax'){jumps(); show('jump','Übersicht')} else show('menu') });
  alles.addEventListener('click',function(){alles.setAttribute('aria-pressed',String(!full())); list()});
  document.addEventListener('keydown',function(e){if(e.key==='Escape' && !sheet.hidden) closeSheet()});
  modeBtns.forEach(function(x){x.addEventListener('click',function(){setMode(x.dataset.m)})});

  // Pur an/aus: gemerkt je Gerät. An: alles steht im Original, Brücken zeigen das Original, Klausur-Paket-Seiten werden überblättert.
  function go2(i){go(i,true,true)}

  // ===== Ton (Michael 15.11.): EIN Knopf oben in der Kopfzeile schaltet allen Ton, Titelton und Vorlesen; gemerkt pro Gerät. Ton kommt nie vor dem ersten Tippen.
  // Vorlesen (nur Blasen mit Feld audio): Mit jeder Blase läuft ihr Ton; ist er zu Ende, kommt die nächste Blase der Karte von selbst (Text im Takt, ohne Tippen).
  // Am Ende der Karte ist Pause bis zum nächsten Wisch: zur nächsten Karte geht es nie von allein. Tippen oder Wischen mittendrin springt zur nächsten Blase.
  // Tippen auf eine Blase spricht sie noch einmal. „Nochmal“ unten links beginnt die Seite von vorn (auch ohne Ton).
  var vzB=document.getElementById('vz'), vzA=null, vzAn=true, vzT=0, vzEl=null, vzOk=false;
  var vzNr=0, vzJob=0;   // jeder Sprechauftrag hat eine Nummer; vzStop macht sie ungültig, verspätete Antworten (Laden, Ende, Fehler) erkennen das und tun nichts
  vzAn=lsG('ton')!=='0';
  var VZ_STILL='data:audio/wav;base64,UklGRiQAAABXQVZFZm10IBAAAAABAAEAQB8AAEAfAAABAAgAZGF0YQAAAAA=';
  function vzIcon(){ vzB.setAttribute('aria-pressed',String(vzAn)); vzB.setAttribute('aria-label',vzAn?'Ton aus':'Ton an');
    vzB.innerHTML='<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 9h4l5-4v14l-5-4H4z"/>'+(vzAn?'<path d="M16.5 8.5a5 5 0 0 1 0 7M19 6a8.5 8.5 0 0 1 0 12"/>':'<path d="M17 9l5 6M22 9l-5 6"/>')+'</svg>' }
  function vzStop(){ clearTimeout(vzT); vzT=0; vzNr++; vzJob=0; if(vzEl){vzEl.classList.remove('spricht'); vzEl=null} if(vzA){ vzA.onended=vzA.onerror=null; try{vzA.pause()}catch(e){} } }
  function vzFrei(){   // ein Tippen oder das Ende eines Wischs schaltet den Sprechton im Browser frei (iPhone: derselbe Spieler wird danach weiterbenutzt)
    if(!vzA||vzOk||!vzAn||vzJob) return; vzOk=true;   // läuft oder lädt gerade ein Ton, bleibt der Spieler in Ruhe
    vzA.onended=vzA.onerror=null;
    try{ vzA.src=VZ_STILL; var pr=vzA.play(); if(pr&&pr.catch) pr.catch(function(e){ if(e&&e.name==='NotAllowedError') vzOk=false }) }catch(x){ vzOk=false }   // abgewiesen: beim nächsten Tippen noch einmal
  }
  function vzWeiter(card,ms){   // nächste Blase von selbst, aber nur auf derselben Karte
    clearTimeout(vzT);
    vzT=setTimeout(function(){ vzT=0; if(!vzAn||cards[idx]!==card||!sheet.hidden) return; next(card) },ms);
  }
  function vzSpiel(s,danach){
    var nr=++vzNr, tot=false; vzJob=nr;
    function aus(){ s.classList.remove('spricht'); if(vzEl===s) vzEl=null; vzJob=0 }
    function fehl(){   // Ton fehlt, lädt nicht oder darf nicht spielen: Zeit zum Lesen lassen, dann geht es weiter wie nach dem Ton
      if(tot||nr!==vzNr) return; tot=true; aus(); vzA.onended=vzA.onerror=null;
      if(danach){ clearTimeout(vzT); vzT=setTimeout(function(){ vzT=0; if(nr===vzNr) danach() },Math.min(9000,1800+s.textContent.length*55)) }
    }
    tonHol(s.dataset.ton,function(u){
      if(nr!==vzNr) return;
      if(!u){ fehl(); return }
      vzEl=s; s.classList.add('spricht');   // markiert wird erst, wenn der Ton da ist, nicht schon beim Laden
      vzA.onended=function(){ if(tot||nr!==vzNr||!vzA.ended) return; aus(); if(danach) danach() };
      vzA.onerror=function(){ if(vzA.error) fehl() };
      try{ vzA.src=u; vzA.currentTime=0; var pr=vzA.play();
        if(pr&&pr.then) pr.then(function(){ if(nr===vzNr) vzOk=true },function(e){ if(e&&e.name==='NotAllowedError') vzOk=false; if(!e||e.name!=='AbortError') fehl() });
      }catch(e){ fehl() }
    });
  }
  // Tonpaket: alle Aufnahmen einer Folge liegen hintereinander in einer mp3 (Dateigrenze der Demo); geteilt wird nach Bytes.
  // Geholt wird das Paket erst, wenn ein Ton daraus gebraucht wird, dazu gleich das der nächsten Folge. Ohne pakete: einzelne Dateien wie bisher.
  var TP={}, TPL=(W.pakete||[]).filter(function(p){return p.a==='t'});
  TPL.forEach(function(p){ p.n.forEach(function(t){ TP[t[0]]=p }) });
  var TPz=0;   // Zähler für „zuletzt gebraucht“: gehalten werden höchstens drei Folgen, die ältesten werden freigegeben
  function tonRaum(){
    var g=TPL.filter(function(x){return x.u}); if(g.length<=3) return;
    g.sort(function(a,b){return (a.z||0)-(b.z||0)}).slice(0,g.length-3).forEach(function(x){ for(var k in x.u) URL.revokeObjectURL(x.u[k]); x.u=null });
  }
  function tonLade(p,cb){
    if(p.u){ if(cb) cb(); return } if(cb) (p.cb=p.cb||[]).push(cb); if(p.l) return; p.l=1;
    function fertig(){ p.l=0; var c=p.cb||[]; p.cb=[]; c.forEach(function(f){f()}) }
    fetch(p.d).then(function(r){ if(!r.ok) throw 0; return r.blob() }).then(function(bl){
      p.u={}; p.z=++TPz; p.n.forEach(function(t){ p.u[t[0]]=URL.createObjectURL(bl.slice(t[1],t[1]+t[2],'audio/mpeg')) }); tonRaum(); fertig() },fertig);
  }
  function tonHol(u,cb){
    var n=u.slice(4), p=TP[n]; if(!p){ cb(u); return }
    tonLade(p,function(){
      if(p.u) p.z=++TPz;
      cb(p.u&&p.u[n]||'');
      if(p.u) TPL.forEach(function(x){ if(x.f===p.f+1) tonLade(x) });   // die nächste Folge erst, wenn die aktuelle da ist
    });
  }
  if(TPL.length) setTimeout(function(){ var fo=+((cards[idx]||{dataset:{}}).dataset.fo)||TPL[0].f; TPL.forEach(function(x){ if(x.f===fo) tonLade(x) }) },3000);
  function vzStep(card,s){
    if(!vzA||!vzAn) return;
    vzStop();
    if(cards[idx]!==card) return;
    var rest=steps(card).filter(function(x){return x.classList.contains('wait')});
    if(!s.dataset.ton){   // Schritt ohne Ton (Merksatz, Hinweis): Zeit zum Lesen lassen, dann weiter, falls danach noch gesprochen wird
      if(rest.some(function(x){return x.dataset.ton})) vzWeiter(card,Math.min(9000,1800+s.textContent.length*55));
      return;
    }
    vzSpiel(s,function(){ if(rest.length) vzWeiter(card,rest[0].dataset.ton?450:900) });
  }
  function vzSag(b){   // eine sichtbare Blase noch einmal sprechen; danach geht nichts von selbst weiter
    if(!vzA||!vzAn||!b.dataset.ton||b.classList.contains('wait')) return false;
    vzStop(); vzSpiel(b,null); return true;
  }
  // Seite von vorn: Blasen wieder der Reihe nach (mit Ton, wenn er an ist). Gilt für jede Bildkarte, auch ohne Ton.
  function neuStart(c){
    vzStop(); stop(c); delete c.dataset.done; reset(c); play(c);
    var l=live.get(c); if(l){ l.timers.push(setTimeout(function(){ var st=steps(c); if(cards[idx]===c&&st.length&&st.every(function(x){return x.classList.contains('wait')})) next(c) },400)) }
  }
  document.getElementById('feed').addEventListener('click',function(e){
    var nb=e.target.closest('.neu'); if(!nb) return;
    e.stopPropagation(); vzFrei(); neuStart(nb.closest('.card'));
  },true);
  if(document.querySelector('.bub[data-ton]')){ vzA=new Audio(); vzA.preload='auto'; document.addEventListener('click',vzFrei,true); document.addEventListener('touchend',vzFrei,{capture:true,passive:true}) }
  if(vzB && (vzA || W.titelseite.ton)){
    vzB.hidden=false; vzIcon();
    vzB.addEventListener('click',function(e){
      e.stopPropagation(); vzAn=!vzAn; lsS('ton',vzAn?'1':'0'); vzIcon();
      if(!vzAn){ vzStop(); if(snd){ try{snd.pause()}catch(x){} } tip('Ton aus'); return }
      unlocked=true; vzFrei();
      var c=cards[idx];
      if(c===cov){ tip('Ton an'); titelStart(); return }
      if(vzA && c && c.querySelector('.bub[data-ton]')){ tip('Ton an'); neuStart(c); return }
      tip(vzA && c && c.querySelector('.bub') ? 'Ton an · Sprechton gibt es bisher auf den ersten Seiten' : 'Ton an');
    });
  }

  // Einführung vor dem Titel: einmal pro Gerät (Menü „So geht’s“ zeigt sie wieder); ihr Knopf ist auch das Tippen, das den Ton erlaubt
  var E=W.einfuehrung||{}, T0=W.titelseite, snd=null, unlocked=false, cov=cards.filter(function(c){return c.dataset.k==='0'})[0];
  if(T0.ton){ snd=new Audio('img/ton-titel.mp3'); snd.preload='auto'; snd.volume=T0.ton.lautstaerke!=null?T0.ton.lautstaerke:.7 }
  var sndVol=snd?snd.volume:1, sndT=0;
  function tonAn(){ return !!(snd&&vzAn&&unlocked) }
  function sndPlay(){ if(!tonAn()) return; clearInterval(sndT); try{snd.volume=sndVol; snd.currentTime=0; var pr=snd.play(); if(pr) pr.catch(function(){})}catch(e){} }
  function sndAus(){ if(!snd||snd.paused) return; clearInterval(sndT); var n=0;   // Titelseite verlassen: Ton blendet kurz aus und hört auf (auf dem iPhone ohne Blende, dort ist die Lautstärke fest)
    sndT=setInterval(function(){ n++; try{snd.volume=Math.max(0,sndVol*(1-n/6))}catch(e){} if(n>=6){clearInterval(sndT); try{snd.pause(); snd.volume=sndVol}catch(e){}} },45) }
  function titelStart(){ stop(cov); play(cov); sndPlay() }   // Bild und Ton immer zusammen starten, sonst laufen sie auseinander
  function unlock(){ if(unlocked) return; unlocked=true; if(cards[idx]===cov) titelStart() }
  document.addEventListener('pointerdown',function(){ if(!unlocked && document.getElementById('intro').hidden && cards[idx]===cov) unlocked=true },true);   // dieses Tippen blättert meist schon weiter: hier nur freischalten, der Ton kommt beim nächsten Besuch der Titelseite
  function intro(force){
    var el=document.getElementById('intro'), seen=lsG('intro')==='1';
    if(seen && !force) return false;
    // Ablauf aus werk.json (einfuehrung.ablauf); ohne ihn die alten Textseiten. Testbildschirm kommt aus test, nur solange test.aktiv
    var S=(E.ablauf||(E.seiten||[{titel:E.titel||'So geht’s',text:E.text||'Tippen zeigt die nächste Blase, Wischen die nächste Seite.'}]).map(function(x){return {art:'text',titel:x.titel,text:x.text}})).slice();
    var TS=W.test; if(TS&&TS.aktiv&&TS.einstieg!==false) S.push({art:'test',bild:TS.bild,kick:TS.kick||'Testphase',titel:TS.titel||'Danke, dass du testest!',text:TS.text||'Lies, so viel du magst. Wenn du fertig bist oder aufhörst: oben rechts auf Feedback tippen. Ein Stern reicht schon.'});
    var n=0, inn=el.querySelector('.in'), y0=null;
    function src(b){return !b?'':b==='titel'?'img/titel-start.webp':'img/h-'+b+'.webp'}
    function step(id){var r=null; W.folgen.forEach(function(F){(F.daten?F.daten.karten:[]).forEach(function(k){(k.schritte||[]).forEach(function(s){if(s.id===id) r={s:s,k:k,F:F}})})}); return r}
    function marke(r){var K=r&&r.F.klausur; if(!K||!r.s.vers) return null; var v=r.s.vers;
      return K.marken.filter(function(m){return m.karte===r.k.id && m.vers[0]<=v[1] && m.vers[1]>=v[0]})[0]||null}
    function draw(dir){
      var s=S[n], last=n===S.length-1, r=s.blase?step(s.blase):null, mk=s.art==='klausur'?marke(r):null;
      var h='<div class="ob-bar">'+S.map(function(x,i){return '<i class="'+(i<n?'d':i===n?'on':'')+'"></i>'}).join('')+'</div>'+
        (s.bild?'<div class="ob-pic"><img src="'+src(s.bild)+'" alt=""></div><div class="ob-shade"></div>':'');
      if(r) h+='<div class="ob-talk"'+(s.oben!=null?' style="top:'+(+s.oben)+'%"':'')+'><p class="bub'+(r.s.seite==='rechts'?' r':'')+' ob-b" data-heute="'+esc(r.s.heute)+'" tabindex="0" role="button">'+
        (mk?'<button type="button" class="km ob-km">Klausur</button>':'')+'<span class="who">'+esc(r.s.wer)+'</span><span class="t">'+r.s.original.map(esc).join('<br>')+'</span></p></div>';
      if(s.art==='test') h+='<div class="ob-fb" aria-hidden="true"><span class="ob-pill"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linejoin="round" stroke-linecap="round"><path d="M4 5h16v11H9l-5 4z"/><path d="M8.5 10.5h.01M12 10.5h.01M15.5 10.5h.01"/></svg>Feedback</span><span class="ob-arrow">↑</span><em>Hier, auf jeder Seite</em></div>';
      h+='<div class="ob-body">'+(s.kick?'<p class="ob-kick">'+esc(s.kick)+'</p>':'')+'<h2 id="intro-t">'+esc(s.titel)+'</h2>'+
        (mk?'<div class="ob-mk" hidden><b>„'+esc(mk.zitat)+'“ (V. '+(mk.vers[0]===mk.vers[1]?mk.vers[0]:mk.vers.join('–'))+')</b><span>'+esc(mk.warum)+'</span></div>':'')+
        '<p class="lead" data-t="'+esc(s.text)+'">'+esc(s.text)+'</p>'+
        '<button type="button" class="go'+(r?' ob-wait':'')+'">'+(last?esc(E.knopf||'Los geht’s')+(T0.ton?' 🔊':''):esc(s.knopf||'Weiter'))+'</button>'+
        (last?(T0.ton?'<p class="fine">Mit kurzem Ton zum Anfang · oben am Lautsprecher stumm schaltbar</p>':''):(n===0?'<p class="ob-swipe">oder nach oben wischen</p>':'<button type="button" class="skip">Überspringen</button>'))+'</div>';
      inn.innerHTML=h; inn.className='in ob-'+s.art+(dir<0?' back':'');
      void inn.offsetWidth; inn.classList.add('show');
      var go=inn.querySelector('.go'); go.focus({preventScroll:true});
      go.addEventListener('click',function(){ if(last) fertig(); else next() });
      var sk=inn.querySelector('.skip'); if(sk) sk.addEventListener('click',fertig);
      var b=inn.querySelector('.ob-b'), lead=inn.querySelector('.lead');
      if(b){
        var heute=false, orig=b.querySelector('.t').innerHTML, who=b.querySelector('.who').textContent;
        function flip(){ heute=!heute; b.classList.toggle('heute',heute); b.querySelector('.t').innerHTML=heute?esc(b.dataset.heute):orig; b.querySelector('.who').textContent=heute?who+' · heute':who;
          if(s.art!=='klausur'){ lead.textContent=heute?(s.danach||'Genau. Nochmal tippen: zurück zum Original.'):lead.dataset.t; go.classList.remove('ob-wait') } }
        b.addEventListener('click',function(e){ if(e.target.closest('.ob-km')) return; flip() });
        b.addEventListener('keydown',function(e){ if(e.key==='Enter'||e.key===' '){e.preventDefault(); flip()} });
        var km=inn.querySelector('.ob-km');
        if(km) km.addEventListener('click',function(e){ e.stopPropagation(); var m=inn.querySelector('.ob-mk'); m.hidden=!m.hidden; km.classList.add('seen'); go.classList.remove('ob-wait'); if(!m.hidden) lead.textContent=s.danach||'So zitierst du die Stelle in der Klausur.' });
      }
    }
    function next(){ if(n<S.length-1){n++; draw(1)} else fertig() }
    function prev(){ if(n>0){n--; draw(-1)} }
    // Wischen wie im Leser: nach oben = weiter, nach unten = zurück. Nichts läuft von allein.
    el.onpointerdown=function(e){ y0=e.target.closest('button,.ob-b')?null:e.clientY };
    el.onpointerup=function(e){ if(y0==null) return; var dy=e.clientY-y0; y0=null; if(dy<-45) next(); else if(dy>45) prev() };
    el.onkeydown=function(e){ if(e.key==='ArrowDown'||e.key==='PageDown') next(); if(e.key==='ArrowUp'||e.key==='PageUp') prev() };
    function fertig(){
      lsS('intro','1');
      el.hidden=true; unlocked=true; el.onpointerdown=el.onpointerup=el.onkeydown=null;
      if(cards[idx]!==cov) goTo(cards.indexOf(cov));
      titelStart(); feed.focus();
    }
    el.hidden=false; draw(1);
    return true;
  }
  if(!intro(false)) standHol();
  standAn=true;

  if('IntersectionObserver' in window){
    var io=new IntersectionObserver(function(es){
      es.forEach(function(e){
        if(e.isIntersecting){
          play(e.target); if(e.target===cov) sndPlay(); if(e.target.dataset.k==='p') bilanz();
          setTop(e.target);
        } else { stop(e.target); if(e.target===cov) sndAus(); }   // der Titelton gehört zur Titelseite: beim Weiterblättern hört er auf
      });
    },{root:feed,threshold:.6});
    cards.forEach(function(c){io.observe(c)});
  } else cards.forEach(showAll);
}
boot();
</script>
