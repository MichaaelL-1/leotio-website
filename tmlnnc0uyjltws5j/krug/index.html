uecke","abschnitt":"1. Auftritt","szene":"Besuch aus Utrecht","hintergrund":"S4-E","vers":[62,66],"titel":"Was gibt es Neues?","kurz":"Licht lacht über die Geschichte und nennt sie spöttisch den „ersten Adamsfall“ aus einem Bett heraus. Adam wechselt schnell das Thema und fragt nach Neuigkeiten. Da fällt Licht ein, was er beinahe vergessen hätte.","merke":"Sprechender Name: Mit „Adamsfall“ verbindet Licht Adams Namen mit dem biblischen Sündenfall. Gemeint sein können ein körperlicher Sturz und ein moralischer Fehltritt. Adam wechselt daraufhin sofort das Thema (V. 62–64).","heute":[{"regie":"Licht lacht."},{"wer":"Licht","text":"Gut, gut."},{"wer":"Adam","text":"Verdammt!"},{"wer":"Licht","text":"Der erste Adamsfall, den Sie aus einem Bett heraus hingelegt haben."},{"wer":"Adam","text":"Bei meiner Seele! Aber was ich sagen wollte: Was gibt es Neues?"},{"wer":"Licht","text":"Ja, was es Neues gibt! Zum Henker, das hätte ich fast vergessen."},{"wer":"Adam","text":"Na?"}],"original":[{"wer":"Licht","regie":"lacht","zeilen":[{"v":62,"t":"Gut, gut."}]},{"wer":"Adam","zeilen":[{"v":62,"t":"Verdammt!"}]},{"wer":"Licht","zeilen":[{"v":62,"t":"Der erste Adamsfall,"},{"v":63,"t":"Den Ihr aus einem Bett hinaus getan."}]},{"wer":"Adam","zeilen":[{"v":64,"t":"Mein Seel!--Doch, was ich sagen wollte, was gibts"},{"v":64,"t":"Neues?"}]},{"wer":"Licht","zeilen":[{"v":65,"t":"Ja, was es Neues gibt!  Der Henker hols,"},{"v":66,"t":"Hätt ichs doch bald vergessen."}]},{"wer":"Adam","zeilen":[{"v":66,"t":"Nun?"}]}]},{"id":"S5-A","abschnitt":"1. Auftritt","szene":"Besuch aus Utrecht","bild":"hoch/S5-A.webp","alt":"Adam lehnt bequem im Stuhl, Licht beugt sich mit erhobenem Finger zu ihm","ebenen":null,"video":null,"einstellung":"tilt","punkte":[[50,72,1.7],[25,42,1.6]],"effekte":[],"soundwort":null,"schritte":[{"art":"blase","id":"S5-A-1","wer":"Licht","seite":"rechts","original":["Macht Euch bereit auf unerwarteten Besuch aus Utrecht."],"heute":"Machen Sie sich auf unerwarteten Besuch aus Utrecht gefasst.","vers":[67,68],"fokus":[62,35,1.7],"audio":null},{"art":"blase","id":"S5-A-2","wer":"Adam","seite":"links","original":["So?"],"heute":"Ach ja?","vers":[68,68],"fokus":[25,42,1.8],"audio":null}]},{"id":"S5-B","abschnitt":"1. Auftritt","szene":"Besuch aus Utrecht","bild":"hoch/S5-B.webp","alt":"Adam fährt erschrocken hoch und hebt abwehrend die Hände","ebenen":null,"video":null,"einstellung":"push","punkte":[[55,48,1.2]],"effekte":[],"soundwort":null,"schritte":[{"art":"blase","id":"S5-B-1","wer":"Licht","seite":"rechts","original":["Der Herr Gerichtsrat kömmt."],"heute":"Der Herr Gerichtsrat kommt.","vers":[68,68],"fokus":[75,50,1.7],"audio":null},{"art":"blase","id":"S5-B-2","wer":"Adam","seite":"links","original":["Wer kömmt?"],"heute":"Wer kommt?","vers":[69,69],"fokus":[35,47,1.8],"ruck":true,"audio":null}]},{"id":"S5-C","abschnitt":"1. Auftritt","szene":"Besuch aus Utrecht","bild":"hoch/S5-C.webp","alt":"Gerichtsrat Walter steht groß mit Dreispitz und Stock auf einem Feldweg, hinter ihm die Sonne","ebenen":[{"art":"bg","datei":"ebenen/S5-C-bg.webp"},{"art":"mg","datei":"ebenen/S5-C-mg.webp","bewegung":"rollen"},{"art":"fg","datei":"ebenen/S5-C-fg.webp"}],"video":{"datei":"videos/S5-C.mp4","ende":"hoch/S5-C-end.webp"},"einstellung":"tilt","punkte":[[45,80,1.9],[48,25,1.7]],"effekte":[],"soundwort":null,"schritte":[{"art":"blase","id":"S5-C-1","wer":"Licht","seite":"links","original":["Der Herr Gerichtsrat Walter kömmt, aus Utrecht.","Er ist in Revisions-Bereisung auf den Ämtern,","Und heut noch trifft er bei uns ein."],"heute":"Gerichtsrat Walter aus Utrecht kommt. Er ist auf Kontrollreise durch die Ämter und trifft noch heute bei uns ein.","vers":[69,71],"fokus":[48,30,1.35],"audio":null},{"art":"blase","id":"S5-C-2","wer":"Adam","seite":"rechts","original":["Noch heut! Seid Ihr bei Trost?"],"heute":"Noch heute! Sind Sie noch bei Trost?","vers":[72,72],"fokus":[50,40,1.0],"ruck":true,"audio":null},{"art":"merke","text":"Revision = Kontrolle des Gerichts durch die vorgesetzte Behörde."}]},{"id":"S5-Cb","art":"bruecke","abschnitt":"1. Auftritt","szene":"Was in Holla geschah","hintergrund":"S5-C","vers":[72,101],"titel":"Adam will es nicht glauben","kurz":"Licht berichtet: Der Gerichtsrat hat gestern schon das Gericht im Nachbardorf Holla geprüft, und ein Bauer hat gesehen, wie die Pferde für die Fahrt nach Huisum angespannt wurden. Adam hält das für ein Märchen und verspottet den Bauern als unzuverlässigen Zeugen. Dem Gerichtsrat unterstellt er, selbst auf seinen Vorteil zu achten.\n\nAußerdem komme kein Revisor unangemeldet. Licht stellt klar: Der frühere Revisor Wacholder ist nicht mehr im Amt. Jetzt prüft Rat Walter.","merke":"„Gerichtsrat“ ist Walters Rang, Revisor seine Aufgabe: Er kontrolliert die Amtsführung der örtlichen Gerichte. Adam beruft sich dagegen auf die gemeinsamen „Gebräuche“ (V. 98–100). Der Wechsel von Wacholder zu Walter zeigt: Darauf kann er sich nicht mehr verlassen.","heute":[{"wer":"Adam","text":"Noch heute! Sind Sie noch bei Trost?"},{"wer":"Licht","text":"So wahr ich lebe. Er war gestern in Holla, dem Grenzdorf, und hat das Gericht dort schon geprüft. Ein Bauer hat gesehen, wie für die Fahrt nach Huisum schon die Pferde vor den Wagen gespannt wurden."},{"wer":"Adam","text":"Heute noch, er, der Gerichtsrat, hierher, aus Utrecht! Zur Revision, der brave Mann, der selbst auf seinen Vorteil schaut und solche Faxen hasst. Nach Huisum kommen und uns schikanieren!"},{"wer":"Licht","text":"Wenn er bis Holla gekommen ist, kommt er auch bis Huisum. Nehmen Sie sich in Acht."},{"wer":"Adam","text":"Ach, gehen Sie!"},{"wer":"Licht","text":"Ich sage es Ihnen."},{"wer":"Adam","text":"Hören Sie auf mit Ihrem Märchen, sage ich."},{"wer":"Licht","text":"Der Bauer hat ihn selbst gesehen, zum Henker."},{"wer":"Adam","text":"Wer weiß, wen der triefäugige Kerl gesehen hat. Diese Burschen können ein Gesicht nicht von einem Hinterkopf unterscheiden, wenn der kahl ist. Setzen Sie einen Dreispitz auf meinen Stock, hängen Sie ihm einen Mantel um, stellen Sie zwei Stiefel darunter, und so ein Trottel hält ihn für jeden, den Sie wollen."},{"wer":"Licht","text":"Na gut, dann zweifeln Sie in Teufels Namen weiter, bis er hier zur Tür hereinkommt."},{"wer":"Adam","text":"Er, hereinkommen! Ohne uns vorher ein Wort gesteckt zu haben."},{"wer":"Licht","text":"So ein Unverstand! Als wäre es noch der frühere Revisor, der Rat Wacholder! Jetzt ist es Rat Walter, der prüft."},{"wer":"Adam","text":"Und wenn schon, Rat Walter! Gehen Sie, lassen Sie mich in Ruhe. Der Mann hat doch seinen Amtseid geschworen und arbeitet wie wir nach den geltenden Vorschriften und Gebräuchen."},{"wer":"Licht","text":"Nun, ich versichere Ihnen: Gerichtsrat Walter …"}],"original":[{"wer":"Adam","zeilen":[{"v":72,"t":"Noch heut!  Seid Ihr bei Trost?"}]},{"wer":"Licht","zeilen":[{"v":72,"t":"So wahr ich lebe."},{"v":73,"t":"Er war in Holla, auf dem Grenzdorf, gestern,"},{"v":74,"t":"Hat das Justizamt dort schon revidiert."},{"v":75,"t":"Ein Bauer sah zur Fahrt nach Huisum schon"},{"v":76,"t":"Die Vorspannpferde vor den Wagen schirren."}]},{"wer":"Adam","zeilen":[{"v":77,"t":"Heut noch, er, der Gerichtsrat, her, aus Utrecht!"},{"v":78,"t":"Zur Revision, der wackre Mann, der selbst"},{"v":79,"t":"Sein Schäfchen schiert, dergleichen Fratzen haßt."},{"v":80,"t":"Nach Huisum kommen und uns kujonieren!"}]},{"wer":"Licht","zeilen":[{"v":81,"t":"Kam er bis Holla, kommt er auch bis Huisum."},{"v":82,"t":"Nehmt Euch in acht."}]},{"wer":"Adam","zeilen":[{"v":82,"t":"Ach, geht!"}]},{"wer":"Licht","zeilen":[{"v":82,"t":"Ich sag es Euch."}]},{"wer":"Adam","zeilen":[{"v":83,"t":"Geht mir mit Eurem Märchen, sag ich Euch."}]},{"wer":"Licht","zeilen":[{"v":84,"t":"Der Bauer hat ihn selbst gesehn, zum Henker."}]},{"wer":"Adam","zeilen":[{"v":85,"t":"Wer weiß, wen der triefäugige Schuft gesehn."},{"v":86,"t":"Die Kerle unterscheiden ein Gesicht"},{"v":87,"t":"Von einem Hinterkopf nicht, wenn er kahl ist."},{"v":88,"t":"Setzt einen Hut dreieckig auf mein Rohr,"},{"v":89,"t":"Hängt ihm den Mantel um, zwei Stiefeln drunter,"},{"v":90,"t":"So hält so'n Schubjak ihn, für wen Ihr wollt."}]},{"wer":"Licht","zeilen":[{"v":91,"t":"Wohlan, so zweifelt fort, ins Teufels Namen,"},{"v":92,"t":"Bis er zur Tür hier eintritt."}]},{"wer":"Adam","zeilen":[{"v":92,"t":"Er, eintreten!--"},{"v":93,"t":"Ohn uns ein Wort vorher gesteckt zu haben."}]},{"wer":"Licht","zeilen":[{"v":94,"t":"Der Unverstand!  Als obs der vorige"},{"v":95,"t":"Revisor noch, der Rat Wacholder, wäre!"},{"v":96,"t":"Es ist Rat Walter jetzt, der revidiert."}]},{"wer":"Adam","zeilen":[{"v":97,"t":"Wenn gleich Rat Walter!  Geht, laßt mich zufrieden."},{"v":98,"t":"Der Mann hat seinen Amtseid ja geschworen,"},{"v":99,"t":"Und praktisiert, wie wir, nach den"},{"v":100,"t":"Bestehenden Edikten und Gebräuchen."}]},{"wer":"Licht","zeilen":[{"v":101,"t":"Nun, ich versichr Euch, der Gerichtsrat Walter"}]}]},{"id":"S6-A","abschnitt":"1. Auftritt","szene":"Was in Holla geschah","bild":"hoch/S6-A.webp","alt":"Eine einsame Scheune unter dunklem Gewitterhimmel","ebenen":null,"video":null,"einstellung":"tiltslow","punkte":[[40,25,1.4],[55,52,1.4]],"effekte":["flash"],"soundwort":null,"schritte":[{"art":"blase","id":"S6-A-1","wer":"Licht","seite":"links","original":["Erschien in Holla unvermutet gestern,","Vis'tierte Kassen und Registraturen,","Und suspendierte Richter dort und Schreiber,"],"heute":"Gestern tauchte er überraschend im Nachbardorf Holla auf, prüfte Kassen und Akten und setzte Richter und Schreiber ab.","vers":[102,104],"fokus":[55,55,1.2],"audio":null}]},{"id":"S6-Ab","art":"bruecke","abschnitt":"1. Auftritt","szene":"Was in Holla geschah","hintergrund":"S6-A","vers":[105,127],"titel":"Der Richter von Holla","kurz":"Licht erzählt, wie die Kontrolle in Holla ausging: Der abgesetzte Richter wurde am Morgen in der Scheune gefunden, er hatte sich erhängt. Man konnte ihn retten, aber sein Haus ist versiegelt und sein Amt schon vergeben. Adam nennt ihn einen liederlichen, sonst aber ehrlichen Kerl. Wegen dieses Vorfalls kommt der Gerichtsrat erst gegen Mittag.","merke":"Der Richter von Holla zeigt, was Adam droht, wenn die Revision schlecht ausgeht. Die Komödie hat hier einen ernsten Untergrund.","heute":[{"wer":"Licht","text":"Warum? Das weiß ich nicht. Ihr Amt sind sie jedenfalls los."},{"wer":"Adam","text":"Zum Teufel! Hat das der Bauer gesagt?"},{"wer":"Licht","text":"Das und noch mehr …"},{"wer":"Adam","text":"Ach?"},{"wer":"Licht","text":"Wenn Sie es wissen wollen: Heute in der Frühe sucht man den Richter, den man in seinem Haus unter Arrest gestellt hatte, und findet ihn hinten in der Scheune, oben am Dachbalken aufgehängt."},{"wer":"Adam","text":"Was sagen Sie?"},{"wer":"Licht","text":"Inzwischen kommt Hilfe. Man schneidet ihn los, man reibt ihn, begießt ihn mit Wasser und bringt ihn gerade so ins Leben zurück."},{"wer":"Adam","text":"So? Man bringt ihn zurück?"},{"wer":"Licht","text":"Aber jetzt wird in seinem Haus versiegelt und verschlossen, und man nimmt Eide ab. Es ist, als wäre er schon tot. Auch sein Richteramt hat bereits ein anderer übernommen."},{"wer":"Adam","text":"Ei, zum Henker! Ein liederlicher Hund war er, sonst aber eine ehrliche Haut, so wahr ich lebe, ein Kerl, mit dem man gut auskam. Aber schrecklich liederlich, das muss ich sagen. Wenn der Gerichtsrat heute in Holla war, dann ist es ihm schlecht ergangen, dem armen Kerl, das glaube ich."},{"wer":"Licht","text":"Und nur dieser Vorfall, sagte der Bauer, sei schuld daran, dass der Gerichtsrat noch nicht hier ist. Bis Mittag treffe er aber ganz sicher ein."}],"original":[{"wer":"Licht","zeilen":[{"v":105,"t":"Warum?  ich weiß nicht, ab officio."}]},{"wer":"Adam","zeilen":[{"v":106,"t":"Den Teufel auch?  Hat das der Bauer gesagt?"}]},{"wer":"Licht","zeilen":[{"v":107,"t":"Dies und noch mehr--"}]},{"wer":"Adam","zeilen":[{"v":107,"t":"So?"}]},{"wer":"Licht","zeilen":[{"v":107,"t":"Wenn Ihrs wissen wollt."},{"v":108,"t":"Denn in der Frühe heut sucht man den Richter,"},{"v":109,"t":"Dem man in seinem Haus Arrest gegeben,"},{"v":110,"t":"Und findet hinten in der Scheuer ihn"},{"v":111,"t":"Am Sparren hoch des Daches aufgehangen."}]},{"wer":"Adam","zeilen":[{"v":112,"t":"Was sagt Ihr?"}]},{"wer":"Licht","zeilen":[{"v":112,"t":"Hilf inzwischen kommt herbei,"},{"v":113,"t":"Man löst ihn ab, man reibt ihn, und begießt ihn,"},{"v":114,"t":"Ins nackte Leben bringt man ihn zurück."}]},{"wer":"Adam","zeilen":[{"v":115,"t":"So?  Bringt man ihn?"}]},{"wer":"Licht","zeilen":[{"v":115,"t":"Doch jetzo wird versiegelt"},{"v":116,"t":"In seinem Haus, vereidet und verschlossen,"},{"v":117,"t":"Es ist, als wär er eine Leiche schon,"},{"v":118,"t":"Und auch sein Richteramt ist schon beerbt."}]},{"wer":"Adam","zeilen":[{"v":119,"t":"Ei, Henker, seht!--Ein liederlicher Hund wars--"},{"v":120,"t":"Sonst eine ehrliche Haut, so wahr ich lebe,"},{"v":121,"t":"Ein Kerl, mit dem sichs gut zusammen war;"},{"v":122,"t":"Doch grausam liederlich, das muß ich sagen."},{"v":123,"t":"Wenn der Gerichtsrat heut in Holla war,"},{"v":124,"t":"So gings ihm schlecht, dem armen Kauz, das glaub ich."}]},{"wer":"Licht","zeilen":[{"v":125,"t":"Und dieser Vorfall einzig, sprach der Bauer,"},{"v":126,"t":"Sei schuld, daß der Gerichtsrat noch nicht hier;"},{"v":127,"t":"Zu Mittag treff er doch ohnfehlbar ein."}]}]},{"id":"S6-B","abschnitt":"1. Auftritt","szene":"Zwei Hände","bild":"hoch/S6-B.webp","alt":"Adam legt Licht vertraulich den Arm um die Schulter","ebenen":[{"art":"bg","datei":"ebenen/S6-B-bg.webp"},{"art":"fg","datei":"ebenen/S6-B-fg.webp"}],"video":null,"einstellung":"creep","punkte":[[45,45,1.3]],"effekte":[],"soundwort":null,"schritte":[{"art":"blase","id":"S6-B-1","wer":"Adam","seite":"rechts","original":["Zu Mittag! Gut, Gevatter! Jetzt gilts Freundschaft.","Ihr wißt, wie sich zwei Hände waschen können."],"heute":"Bis Mittag! Gut, mein Freund, jetzt zählt Freundschaft. Sie wissen ja: Eine Hand wäscht die andere.","vers":[128,129],"fokus":[52,45,1.7],"audio":null},{"art":"blase","id":"S6-B-2","wer":"Adam","seite":"rechts","original":["Ihr wollt auch gern, ich weiß, Dorfrichter werden,","Und Ihr verdients, bei Gott, so gut wie einer."],"heute":"Sie wollen auch gern Dorfrichter werden, das weiß ich. Und Sie hätten es verdient wie kaum einer.","vers":[130,131],"fokus":[33,45,1.9],"audio":null},{"art":"merke","text":"Adam schmeichelt und lockt: Er braucht Licht auf seiner Seite.","fokus":[45,48,1.0]}]},{"id":"S6-Bb","art":"bruecke","abschnitt":"1. Auftritt","szene":"Zwei Hände","hintergrund":"S6-B","vers":[132,162],"titel":"Adam wirbt um Lichts Schweigen","kurz":"Adam bittet Licht, heute noch auf das Richteramt zu verzichten und zu schweigen, so wie einst der große Redner Demosthenes geschwiegen hat. Er verspricht, sich dankbar zu zeigen. Licht weist den Verdacht zurück, er wolle Adam schaden.\n\nAdam deutet an, dass sich auch über Gelder und Zinsen im Amt reden ließe, und nennt seine eigene Sache einen harmlosen „Schwank“ der Nacht. Dann gehen beide die Akten ordnen.","merke":"Von Demosthenes hieß es, er habe sich sein Schweigen bezahlen lassen. Adam bietet Licht also versteckt eine Belohnung für sein Schweigen an (V. 142–145). Mit den „Depositionen“ und „Zinsen“ (V. 149) folgt gleich danach eine versteckte Drohung. „Lichtstrahl“ (V. 155) spielt mit dem Namen des Schreibers: Adams Sache soll gerade nicht ans Licht kommen.","heute":[{"wer":"Adam","text":"Aber heute ist noch nicht die Gelegenheit dafür. Heute lassen Sie den Kelch noch einmal an sich vorübergehen."},{"wer":"Licht","text":"Dorfrichter, ich! Was denken Sie von mir?"},{"wer":"Adam","text":"Sie sind ein Freund der gut gesetzten Rede, und Ihren Cicero haben Sie so gründlich studiert, dass Sie es mit jedem an der Hochschule in Amsterdam aufnehmen können. Halten Sie Ihren Ehrgeiz heute zurück, hören Sie? Es werden sich noch Fälle ergeben, in denen Sie Ihre Kunst zeigen können."},{"wer":"Licht","text":"Wir zwei, als alte Freunde! Hören Sie auf."},{"wer":"Adam","text":"Zu seiner Zeit, das wissen Sie, hat auch der große Demosthenes geschwiegen. Nehmen Sie sich daran ein Beispiel. Und bin ich auch nicht der König von Mazedonien, so kann ich doch auf meine Art dankbar sein."},{"wer":"Licht","text":"Hören Sie auf mit Ihrem Misstrauen, sage ich Ihnen. Habe ich jemals …?"},{"wer":"Adam","text":"Sehen Sie, ich für meinen Teil folge dem großen Griechen auch. Über hinterlegte Gelder und Zinsen ließe sich am Ende auch eine Rede ausarbeiten. Aber wer wollte solche Sätze drechseln?"},{"wer":"Licht","text":"Na also!"},{"wer":"Adam","text":"Von so einem Vorwurf bin ich frei, zum Henker! Und alles, worum es geht, ist höchstens ein Streich, der in der Nacht geboren wurde und das vorwitzige Tageslicht scheut."},{"wer":"Licht","text":"Ich weiß."},{"wer":"Adam","text":"Bei meiner Seele! Es gibt keinen Grund, warum ein Richter, wenn er nicht auf dem Richterstuhl sitzt, würdevoll wie ein Eisbär sein soll."},{"wer":"Licht","text":"Das sage ich auch."},{"wer":"Adam","text":"Nun denn, kommen Sie, mein Freund, folgen Sie mir kurz in die Registratur. Ich staple die Akten auf, denn die liegen durcheinander wie der Turm zu Babel."}],"original":[{"wer":"Adam","zeilen":[{"v":132,"t":"Doch heut ist noch nicht die Gelegenheit,"},{"v":133,"t":"Heut laßt Ihr noch den Kelch vorübergehn."}]},{"wer":"Licht","zeilen":[{"v":134,"t":"Dorfrichter, ich!  Was denkt Ihr auch von mir?"}]},{"wer":"Adam","zeilen":[{"v":135,"t":"Ihr seid ein Freund von wohlgesetzter Rede,"},{"v":136,"t":"Und Euren Cicero habt Ihr studiert"},{"v":137,"t":"Trotz Einem auf der Schul in Amsterdam."},{"v":138,"t":"Drückt Euren Ehrgeiz heut hinunter, hört Ihr?"},{"v":139,"t":"Es werden wohl sich Fälle noch ergeben,"},{"v":140,"t":"Wo Ihr mit Eurer Kunst Euch zeigen könnt."}]},{"wer":"Licht","zeilen":[{"v":141,"t":"Wir zwei Gevatterleute!  Geht mir fort."}]},{"wer":"Adam","zeilen":[{"v":142,"t":"Zu seiner Zeit, Ihr wißts, schwieg auch der große"},{"v":143,"t":"Demosthenes.  Folgt hierin seinem Muster."},{"v":144,"t":"Und bin ich König nicht von Mazedonien,"},{"v":145,"t":"Kann ich auf meine Art doch dankbar sein."}]},{"wer":"Licht","zeilen":[{"v":146,"t":"Geht mir mit Eurem Argwohn, sag ich Euch."},{"v":147,"t":"Hab ich jemals--?"}]},{"wer":"Adam","zeilen":[{"v":147,"t":"Seht, ich, ich, für mein Teil,"},{"v":148,"t":"Dem großen Griechen folg ich auch.  Es ließe"},{"v":149,"t":"Von Depositionen sich und Zinsen"},{"v":150,"t":"Zuletzt auch eine Rede ausarbeiten:"},{"v":151,"t":"Wer wollte solche Perioden drehn?"}]},{"wer":"Licht","zeilen":[{"v":152,"t":"Nun, also!"}]},{"wer":"Adam","zeilen":[{"v":152,"t":"Von solchem Vorwurf bin ich rein,"},{"v":153,"t":"Der Henker hols!  Und alles, was es gilt,"},{"v":154,"t":"Ein Schwank ists etwa, der, zur Nacht geboren,"},{"v":155,"t":"Des Tags vorwitz'gen Lichtstrahl scheut."}]},{"wer":"Licht","zeilen":[{"v":155,"t":"Ich weiß."}]},{"wer":"Adam","zeilen":[{"v":156,"t":"Mein Seel!  Es ist kein Grund, warum ein Richter,"},{"v":157,"t":"Wenn er nicht auf dem Richtstuhl sitzt,"},{"v":158,"t":"Soll gravitätisch wie ein Eisbär sein."}]},{"wer":"Licht","zeilen":[{"v":159,"t":"Das sag ich auch."}]},{"wer":"Adam","zeilen":[{"v":159,"t":"Nun denn, so kommt, Gevatter,"},{"v":160,"t":"Folgt mir ein wenig zur Registratur;"},{"v":161,"t":"Die Aktenstöße setz ich auf, denn die,"},{"v":162,"t":"Die liegen wie der Turm zu Babylon."}]}]},{"id":"S6-C","abschnitt":"1. Auftritt","szene":"Zwei Hände","bild":"hoch/S6-C.webp","alt":"Nahaufnahme: Lichts Auge blickt berechnend zur Seite, er lächelt schmal","ebenen":null,"video":null,"einstellung":"tiltslow","punkte":[[48,50,1.5],[40,75,1.5]],"effekte":[],"soundwort":null,"schritte":[]},{"id":"S7-A","abschnitt":"2. Auftritt","szene":"Er ist da","bild":"hoch/S7-A.webp","alt":"Ein Diener steht in der offenen Tür und ruft in die Stube","ebenen":null,"video":null,"einstellung":"whip","punkte":[[20,60,1.5],[68,43,1.6]],"effekte":["flash1"],"soundwort":null,"schritte":[{"art":"kasten","text":"Ein Bedienter tritt auf."},{"art":"blase","id":"S7-A-1","wer":"Der Bediente","seite":"rechts","original":["Gott helf, Herr Richter! Der Gerichtsrat Walter","Läßt seinen Gruß vermelden, gleich wird er hier sein."],"heute":"Guten Tag, Herr Richter! Gerichtsrat Walter lässt grüßen, er ist gleich hier.","vers":[163,164],"fokus":[55,43,1.3],"audio":null}]},{"id":"S7-Ab","art":"bruecke","abschnitt":"2. Auftritt","szene":"Er ist da","hintergrund":"S7-A","vers":[165,169],"titel":"Schon in Huisum","kurz":"Der Bediente bestätigt: Der Gerichtsrat ist mit Holla fertig und schon im Dorf. Adam ruft aufgeregt nach den Mägden. Licht bleibt ruhig und übernimmt die Höflichkeiten.","merke":"Der Schreiber behält die Übersicht, der Richter verliert sie.","heute":[{"wer":"Adam","text":"Ach du gerechter Himmel! Ist er mit Holla schon fertig?"},{"wer":"Der Bediente","text":"Ja, er ist schon in Huisum."},{"wer":"Adam","text":"He! Liese! Grete!"},{"wer":"Licht","text":"Ruhig, ganz ruhig jetzt."},{"wer":"Adam","text":"Mein Lieber!"},{"wer":"Licht","text":"Lassen Sie Ihren Dank ausrichten."},{"wer":"Der Bediente","text":"Und morgen reisen wir weiter nach Hussahe."}],"original":[{"wer":"Adam","zeilen":[{"v":165,"t":"Ei, du gerechter Himmel!  Ist er mit Holla"},{"v":166,"t":"Schon fertig?"}]},{"wer":"Der Bediente","zeilen":[{"v":166,"t":"Ja, er ist in Huisum schon."}]},{"wer":"Adam","zeilen":[{"v":167,"t":"He!  Liese!  Grete!"}]},{"wer":"Licht","zeilen":[{"v":167,"t":"Ruhig, ruhig jetzt."}]},{"wer":"Adam","zeilen":[{"v":168,"t":"Gevatterchen!"}]},{"wer":"Licht","zeilen":[{"v":168,"t":"Laßt Euern Dank vermelden."}]},{"wer":"Der Bediente","zeilen":[{"v":169,"t":"Und morgen reisen wir nach Hussahe."}]}]},{"id":"S7-B","abschnitt":"2. Auftritt","szene":"Er ist da","bild":"hoch/S7-B.webp","alt":"Adam dreht sich hektisch im Kreis und zerrt an seiner Robe, Staub wirbelt auf","ebenen":null,"video":{"datei":"videos/S7-B.mp4","ende":"hoch/S7-B-end.webp"},"einstellung":"whip","punkte":[[15,42,1.7],[55,45,1.5]],"effekte":["lines","wobble"],"soundwort":null,"schritte":[{"art":"blase","id":"S7-B-1","wer":"Adam","seite":"links","original":["Was tu ich jetzt? Was laß ich?"],"heute":"Was mache ich jetzt? Was lasse ich bleiben?","vers":[170,170],"fokus":[55,50,1.25],"audio":null}]},{"id":"S7-Bb","art":"bruecke","abschnitt":"2. Auftritt","szene":"Er ist da","hintergrund":"S7-B","vers":[170,193],"titel":"Adam meldet sich krank","kurz":"Adam greift in der Hektik nach den falschen Kleidern, die Mägde kommen gelaufen. Licht lässt dem Gerichtsrat ausrichten, man sei gleich bereit. Adam dagegen will sich entschuldigen lassen: Er sei gestürzt und krank.\n\nDer Gerichtsrat wartet noch im Wirtshaus, weil der Wagen kaputt ist. Licht redet Adam die Krankmeldung aus.","merke":"Adams erster Einfall ist, dem Gerichtsrat gar nicht erst zu begegnen. Ausweichen statt sich stellen: Das ist sein Muster.","heute":[{"wer":"Adam","text":"Was mache ich jetzt? Was lasse ich bleiben?"},{"regie":"Er greift nach seinen Kleidern."},{"regie":"Die erste Magd tritt auf."},{"wer":"Erste Magd","text":"Hier bin ich, Herr."},{"wer":"Licht","text":"Wollen Sie etwa die Hose anziehen? Sind Sie verrückt?"},{"regie":"Die zweite Magd tritt auf."},{"wer":"Zweite Magd","text":"Hier bin ich, Herr Dorfrichter."},{"wer":"Licht","text":"Nehmen Sie den Rock."},{"regie":"Adam sieht sich um."},{"wer":"Adam","text":"Wer? Der Gerichtsrat?"},{"wer":"Licht","text":"Ach was, es ist die Magd."},{"wer":"Adam","text":"Das Beffchen! Mantel! Kragen!"},{"wer":"Erste Magd","text":"Erst die Weste!"},{"wer":"Adam","text":"Was? Rock aus? Schnell!"},{"regie":"Licht zum Bedienten."},{"wer":"Licht","text":"Der Herr Gerichtsrat ist hier sehr willkommen. Wir sind gleich bereit, ihn zu empfangen. Sagen Sie ihm das."},{"wer":"Adam","text":"Zum Teufel! Der Richter Adam lässt sich entschuldigen."},{"wer":"Licht","text":"Entschuldigen!"},{"wer":"Adam","text":"Entschuldigen. Ist er denn schon unterwegs?"},{"wer":"Der Bediente","text":"Er ist noch im Wirtshaus. Er hat den Schmied bestellt, der Wagen ist entzweigegangen."},{"wer":"Adam","text":"Gut. Meine Empfehlung! Der Schmied ist faul. Ich ließe mich entschuldigen. Ich hätte mir fast Hals und Beine gebrochen. Sehen Sie selbst, es ist ein Jammer, wie ich aussehe. Und jeder Schreck schlägt mir von Natur aus auf den Darm. Ich sei krank."},{"wer":"Licht","text":"Sind Sie noch bei Sinnen? Der Herr Gerichtsrat sei sehr willkommen. Wollen Sie wohl?"},{"wer":"Adam","text":"Zum Henker!"},{"wer":"Licht","text":"Was?"},{"wer":"Adam","text":"Der Teufel soll mich holen: Es ist schon so gut, als hätte ich ein Abführmittel genommen!"},{"wer":"Licht","text":"Das fehlte gerade noch, dass Sie den Gerichtsrat gleich wieder wegschicken!"},{"wer":"Adam","text":"Margarete! He! Du Sack voll Knochen! Liese!"},{"wer":"Die beiden Mägde","text":"Hier sind wir doch. Was wollen Sie?"},{"wer":"Adam","text":"Los jetzt, sage ich!"}],"original":[{"wer":"Adam","zeilen":[{"v":170,"t":"Was tu ich jetzt?  Was laß ich?"}]},{"regie":"Er greift nach seinen Kleidern."},{"wer":"Erste Magd","regie":"tritt auf","zeilen":[{"v":170,"t":"Hier bin ich, Herr."}]},{"wer":"Licht","zeilen":[{"v":171,"t":"Wollt Ihr die Hosen anziehn?  Seid Ihr toll?"}]},{"wer":"Zweite Magd","regie":"tritt auf","zeilen":[{"v":172,"t":"Hier bin ich, Herr Dorfrichter."}]},{"wer":"Licht","zeilen":[{"v":172,"t":"Nehmt den Rock."}]},{"wer":"Adam","regie":"sieht sich um","zeilen":[{"v":173,"t":"Wer?  Der Gerichtsrat?"}]},{"wer":"Licht","zeilen":[{"v":173,"t":"Ach, die Magd ist es."}]},{"wer":"Adam","zeilen":[{"v":174,"t":"Die Bäffchen!  Mantel!  Kragen!"}]},{"wer":"Erste Magd","zeilen":[{"v":174,"t":"Erst die Weste!"}]},{"wer":"Adam","zeilen":[{"v":175,"t":"Was?--Rock aus?  Hurtig!"}]},{"wer":"Licht","regie":"zum Bedienten","zeilen":[{"v":175,"t":"Der Herr Gerichtsrat werden"},{"v":176,"t":"Hier sehr willkommen sein.  Wir sind sogleich"},{"v":177,"t":"Bereit, ihn zu empfangen.  Sagt ihm das."}]},{"wer":"Adam","zeilen":[{"v":178,"t":"Den Teufel auch!  Der Richter Adam läßt sich"},{"v":179,"t":"Entschuldigen."}]},{"wer":"Licht","zeilen":[{"v":179,"t":"Entschuldigen!"}]},{"wer":"Adam","zeilen":[{"v":179,"t":"Entschuld'gen."},{"v":180,"t":"Ist er schon unterwegs etwa?"}]},{"wer":"Der Bediente","zeilen":[{"v":180,"t":"Er ist"},{"v":181,"t":"Im Wirtshaus noch.  Er hat den Schmied bestellt;"},{"v":182,"t":"Der Wagen ging entzwei."}]},{"wer":"Adam","zeilen":[{"v":182,"t":"Gut.  Mein Empfehl!"},{"v":183,"t":"Der Schmied ist faul.  Ich ließe mich entschuldigen."},{"v":184,"t":"Ich hätte Hals und Beine fast gebrochen,"},{"v":185,"t":"Schaut selbst, 's ist ein Spektakel, wie ich ausseh;"},{"v":186,"t":"Und jeder Schreck purgiert mich von Natur."},{"v":187,"t":"Ich wäre krank."}]},{"wer":"Licht","zeilen":[{"v":187,"t":"Seid Ihr bei Sinnen?--"},{"v":188,"t":"Der Herr Gerichtsrat wär sehr angenehm."},{"v":189,"t":"--Wollt Ihr?"}]},{"wer":"Adam","zeilen":[{"v":189,"t":"Zum Henker!"}]},{"wer":"Licht","zeilen":[{"v":189,"t":"Was?"}]},{"wer":"Adam","zeilen":[{"v":189,"t":"Der Teufel soll mich holen,"},{"v":190,"t":"Ists nicht so gut, als hätt ich schon ein Pulver!"}]},{"wer":"Licht","zeilen":[{"v":191,"t":"Das fehlt noch, daß Ihr auf den Weg ihm leuchtet."}]},{"wer":"Adam","zeilen":[{"v":192,"t":"Margarete!  he!  Der Sack voll Knochen!  Liese!"}]},{"wer":"Die beiden Mägde","zeilen":[{"v":193,"t":"Hier sind wir ja.  Was wollt Ihr?"}]},{"wer":"Adam","zeilen":[{"v":193,"t":"Fort! sag ich."}]}]},{"id":"S7-C","abschnitt":"2. Auftritt","szene":"Er ist da","bild":"hoch/S7-C.webp","alt":"Zwei Mägde rennen lachend mit Käse, Würsten und Flaschen aus dem Aktenschrank","ebenen":[{"art":"bg","datei":"ebenen/S7-C-bg.webp"},{"art":"fg","datei":"ebenen/S7-C-fg.webp"}],"video":null,"einstellung":"whip","punkte":[[85,55,1.7],[48,45,1.4]],"effekte":["bounce"],"soundwort":null,"schritte":[{"art":"blase","id":"S7-C-1","wer":"Adam","seite":"rechts","original":["Kuhkäse, Schinken, Butter, Würste, Flaschen","Aus der Registratur geschafft! Und flink!"],"heute":"Käse, Schinken, Butter, Würste, Flaschen raus aus dem Aktenschrank! Und zwar schnell!","vers":[194,195],"fokus":[48,48,1.25],"audio":null},{"art":"merke","text":"Im Aktenschrank liegt Essen: So ordentlich führt Adam sein Amt.","fokus":[40,58,1.9]}]},{"id":"S7-Cb","art":"bruecke","abschnitt":"2. Auftritt","szene":"Er ist da","hintergrund":"S7-C","vers":[196,214],"titel":"Der Wagen im Hohlweg","kurz":"Adam schickt die eine Magd in die Registratur und die andere nach der Perücke. Licht erkundigt sich höflich nach der Reise. Der Bediente erzählt, dass der Wagen im Hohlweg umgestürzt ist und der Gerichtsrat sich die Hand verstaucht hat. Adam wünscht ihm halblaut Schlimmeres.\n\nDann reden alle aneinander vorbei, und der Bediente geht kopfschüttelnd.","merke":"Lichts Frage nach dem Schmied kann sich auf den kaputten Wagen beziehen. Adam verknüpft sie mit Walters verletzter Hand und wirft Licht Verlegenheit vor. Die mehrdeutigen Bezüge erzeugen Sprachkomik (V. 209–214).","heute":[{"wer":"Adam","text":"Du nicht. Die andere. Du Maulaffe! Ja, du! Herrgott, Margarete! Liese, die Kuhmagd, soll in die Registratur!"},{"regie":"Die erste Magd geht ab."},{"wer":"Die zweite Magd","text":"Reden Sie so, dass man Sie versteht!"},{"wer":"Adam","text":"Halt jetzt den Mund, sage ich! Los, hol mir die Perücke! Marsch! Aus dem Bücherschrank! Schnell! Ab mit dir!"},{"regie":"Die zweite Magd ab."},{"regie":"Licht zum Bedienten."},{"wer":"Licht","text":"Dem Herrn Gerichtsrat ist auf der Reise hoffentlich nichts Schlimmes zugestoßen?"},{"wer":"Der Bediente","text":"Na ja. Wir sind im Hohlweg umgekippt."},{"wer":"Adam","text":"Verflucht! Mein wunder Fuß! Ich kriege die Stiefel nicht …"},{"wer":"Licht","text":"Du lieber Himmel! Umgekippt, sagen Sie? Aber sonst kein Schaden?"},{"wer":"Der Bediente","text":"Nichts von Bedeutung. Der Herr hat sich die Hand ein wenig verstaucht. Die Deichsel ist gebrochen."},{"wer":"Adam","text":"Hätte er sich doch den Hals gebrochen!"},{"wer":"Licht","text":"Die Hand verstaucht! Ach Gott! War der Schmied schon da?"},{"wer":"Der Bediente","text":"Ja, für die Deichsel."},{"wer":"Licht","text":"Was?"},{"wer":"Adam","text":"Sie meinen den Arzt."},{"wer":"Licht","text":"Was?"},{"wer":"Der Bediente","text":"Für die Deichsel?"},{"wer":"Adam","text":"Ach was! Für die Hand."},{"wer":"Der Bediente","text":"Auf Wiedersehen, die Herren. Ich glaube, die Kerle sind verrückt."},{"regie":"Ab."},{"wer":"Licht","text":"Den Schmied meinte ich."},{"wer":"Adam","text":"Sie verraten sich, mein Freund."},{"wer":"Licht","text":"Wieso?"},{"wer":"Adam","text":"Sie sind verlegen."},{"wer":"Licht","text":"Was!"},{"regie":"Die erste Magd tritt auf."},{"wer":"Adam","text":"He! Liese!"}],"original":[{"wer":"Adam","zeilen":[{"v":196,"t":"Du nicht.  Die andere.--Maulaffe!  Du, ja!"},{"v":197,"t":"--Gotts Blitz, Margarete!  Liese soll, die Kuhmagd,"},{"v":198,"t":"In die Registratur!"}]},{"regie":"Die erste Magd geht ab."},{"wer":"Die zweite Magd","zeilen":[{"v":198,"t":"Sprecht, soll man Euch verstehn!"}]},{"wer":"Adam","zeilen":[{"v":199,"t":"Halts Maul jetzt, sag ich--!  Fort!  schaff mir die Perücke!"},{"v":200,"t":"Marsch!  Aus dem Bücherschrank!  Geschwind!  Pack dich!"}]},{"regie":"Die zweite Magd ab."},{"wer":"Licht","regie":"zum Bedienten","zeilen":[{"v":201,"t":"Es ist dem Herrn Gerichtsrat, will ich hoffen,"},{"v":202,"t":"Nichts Böses auf der Reise zugestoßen?"}]},{"wer":"Der Bediente","zeilen":[{"v":203,"t":"Je, nun!  Wir sind im Hohlweg umgeworfen."}]},{"wer":"Adam","zeilen":[{"v":204,"t":"Pest!  Mein geschundner Fuß!  Ich krieg die Stiefeln--"}]},{"wer":"Licht","zeilen":[{"v":205,"t":"Ei, du mein Himmel!  Umgeworfen, sagt Ihr?"},{"v":206,"t":"Doch keinen Schaden weiter--?"}]},{"wer":"Der Bediente","zeilen":[{"v":206,"t":"Nichts von Bedeutung."},{"v":207,"t":"Der Herr verstauchte sich die Hand ein wenig."},{"v":208,"t":"Die Deichsel brach."}]},{"wer":"Adam","zeilen":[{"v":208,"t":"Daß er den Hals gebrochen!"}]},{"wer":"Licht","zeilen":[{"v":209,"t":"Die Hand verstaucht!  Ei, Herr Gott!  Kam der Schmied schon?"}]},{"wer":"Der Bediente","zeilen":[{"v":210,"t":"Ja, für die Deichsel."}]},{"wer":"Licht","zeilen":[{"v":210,"t":"Was?"}]},{"wer":"Adam","zeilen":[{"v":210,"t":"Ihr meint, der Doktor."}]},{"wer":"Licht","zeilen":[{"v":211,"t":"Was?"}]},{"wer":"Der Bediente","zeilen":[{"v":211,"t":"Für die Deichsel?"}]},{"wer":"Adam","zeilen":[{"v":211,"t":"Ach, was!  Für die Hand."}]},{"wer":"Der Bediente","zeilen":[{"v":212,"t":"Adies, ihr Herrn.--Ich glaub, die Kerls sind toll."}]},{"regie":"Ab."},{"wer":"Licht","zeilen":[{"v":213,"t":"Den Schmied meint ich."}]},{"wer":"Adam","zeilen":[{"v":213,"t":"Ihr gebt Euch bloß, Gevatter."}]},{"wer":"Licht","zeilen":[{"v":214,"t":"Wieso?"}]},{"wer":"Adam","zeilen":[{"v":214,"t":"Ihr seid verlegen."}]},{"wer":"Licht","zeilen":[{"v":214,"t":"Was!"}]},{"regie":"Die erste Magd tritt auf."},{"wer":"Adam","zeilen":[{"v":214,"t":"He!  Liese!"}]}]},{"id":"S7-D","abschnitt":"2. Auftritt","szene":"Er ist da","bild":"hoch/S7-D.webp","alt":"Eine Magd hält lachend eine große Wurst hoch, Adam zeigt darauf","ebenen":null,"video":null,"einstellung":"push","punkte":[[50,55,1.7]],"effekte":[],"soundwort":null,"schritte":[{"art":"blase","id":"S7-D-1","wer":"Erste Magd","seite":"links","original":["Braunschweiger Wurst, Herr Richter."],"heute":"Braunschweiger Wurst, Herr Richter.","vers":[215,215],"fokus":[15,45,1.8],"audio":null},{"art":"blase","id":"S7-D-2","wer":"Adam","seite":"rechts","original":["Das sind Pupillenakten."],"heute":"Das sind Vormundschaftsakten.","vers":[216,216],"fokus":[75,42,1.8],"ruck":true,"audio":null},{"art":"merke","text":"Pupillenakten = Akten über Mündel, also Kinder unter Vormundschaft.","fokus":[30,35,2.0]}]},{"id":"S8-A","abschnitt":"2. Auftritt","szene":"Wo ist die Perücke?","bild":"hoch/S8-A.webp","alt":"Eine Magd zuckt ratlos mit den Schultern, Adam steht ohne Perücke dahinter","ebenen":null,"video":null,"einstellung":"tilt","punkte":[[55,62,1.6],[25,35,1.9]],"effekte":[],"soundwort":null,"schritte":[{"art":"blase","id":"S8-A-1","wer":"Zweite Magd","seite":"rechts","original":["Im Bücherschrank,","Herr Richter, find ich die Perücke nicht."],"heute":"Im Bücherschrank finde ich die Perücke nicht, Herr Richter.","vers":[219,220],"fokus":[55,52,1.5],"audio":null}]},{"id":"S8-Ab","art":"bruecke","abschnitt":"2. Auftritt","szene":"Wo ist die Perücke?","hintergrund":"S8-A","vers":[215,241],"titel":"Ohne Perücke nach Hause","kurz":"Die erste Magd bringt Würste, die in Vormundschaftsakten eingewickelt sind. Adam verlangt das Papier für die Registratur zurück. Dann die schlechte Nachricht: Die Perücke ist nicht im Schrank, die zweite ist beim Perückenmacher. Die Mägde erinnern sich genau: Adam kam gestern Abend um elf ohne Perücke und mit blutigem Kopf nach Hause.\n\nAdam streitet alles ab und schickt Margarete zum Küster, eine Perücke leihen.","merke":"Analytisches Drama: Was vorher geschah, wird nachträglich aus Aussagen zusammengesetzt. Hier widersprechen die Mägde Adams Erklärung seiner Wunden (V. 222–230), und Licht fragt sofort nach (V. 233). Die Würste im Aktenpapier sind Justizsatire: So nachlässig wird dieses Amt geführt.","heute":[{"wer":"Adam","text":"Was hast du da?"},{"wer":"Erste Magd","text":"Braunschweiger Wurst, Herr Richter."},{"wer":"Adam","text":"Das sind Vormundschaftsakten."},{"wer":"Licht","text":"Ich, verlegen!"},{"wer":"Adam","text":"Die kommen zurück in die Registratur."},{"wer":"Erste Magd","text":"Die Würste?"},{"wer":"Adam","text":"Würste! Unsinn! Das Papier hier, in das sie eingeschlagen sind."},{"wer":"Licht","text":"Es war ein Missverständnis."},{"regie":"Die zweite Magd tritt auf."},{"wer":"Zweite Magd","text":"Im Bücherschrank finde ich die Perücke nicht, Herr Richter."},{"wer":"Adam","text":"Warum nicht?"},{"wer":"Zweite Magd","text":"Hm! Weil Sie …"},{"wer":"Adam","text":"Na?"},{"wer":"Zweite Magd","text":"Gestern Abend, Schlag elf …"},{"wer":"Adam","text":"Na? Höre ich es bald?"},{"wer":"Zweite Magd","text":"Ach, Sie kamen doch, erinnern Sie sich, ohne die Perücke nach Hause."},{"wer":"Adam","text":"Ich, ohne die Perücke?"},{"wer":"Zweite Magd","text":"Ganz bestimmt. Da ist die Liese, die kann es bezeugen. Und Ihre andere ist beim Perückenmacher."},{"wer":"Adam","text":"Ich wäre …?"},{"wer":"Erste Magd","text":"Ja, wahrhaftig, Herr Richter Adam! Kahlköpfig waren Sie, als Sie zurückkamen. Sie sagten, Sie seien gestürzt, wissen Sie das nicht mehr? Ich musste Ihnen noch das Blut vom Kopf waschen."},{"wer":"Adam","text":"Die Unverschämte!"},{"wer":"Erste Magd","text":"Ich will nicht ehrlich heißen, wenn es nicht stimmt."},{"wer":"Adam","text":"Halt den Mund, sage ich, daran ist kein wahres Wort."},{"wer":"Licht","text":"Haben Sie die Wunde schon seit gestern?"},{"wer":"Adam","text":"Nein, seit heute. Die Wunde heute und die Perücke gestern. Ich trug sie weiß gepudert auf dem Kopf und habe sie, Ehrenwort, nur aus Versehen zusammen mit dem Hut abgenommen, als ich ins Haus kam. Was die da zusammengeschwatzt hat, weiß ich nicht. Scher dich zum Teufel, wo du hingehörst! In die Registratur!"},{"regie":"Erste Magd ab."},{"wer":"Adam","text":"Geh, Margarete! Der Küster soll mir seine leihen."}],"original":[{"wer":"Adam","zeilen":[{"v":215,"t":"Was hast du da?"}]},{"wer":"Erste Magd","zeilen":[{"v":215,"t":"Braunschweiger Wurst, Herr Richter."}]},{"wer":"Adam","zeilen":[{"v":216,"t":"Das sind Pupillenakten."}]},{"wer":"Licht","zeilen":[{"v":216,"t":"Ich, verlegen!"}]},{"wer":"Adam","zeilen":[{"v":217,"t":"Die kommen wieder zur Registratur."}]},{"wer":"Erste Magd","zeilen":[{"v":218,"t":"Die Würste?"}]},{"wer":"Adam","zeilen":[{"v":218,"t":"Würste!  Was!  Der Einschlag hier."}]},{"wer":"Licht","zeilen":[{"v":219,"t":"Es war ein Mißverständnis."}]},{"wer":"Die zweite Magd","regie":"tritt auf","zeilen":[{"v":219,"t":"Im Bücherschrank,"},{"v":220,"t":"Herr Richter, find ich die Perücke nicht."}]},{"wer":"Adam","zeilen":[{"v":221,"t":"Warum nicht?"}]},{"wer":"Zweite Magd","zeilen":[{"v":221,"t":"Hm!  Weil Ihr--"}]},{"wer":"Adam","zeilen":[{"v":221,"t":"Nun?"}]},{"wer":"Zweite Magd","zeilen":[{"v":221,"t":"Gestern abend--"},{"v":222,"t":"Glock elf--"}]},{"wer":"Adam","zeilen":[{"v":222,"t":"Nun?  Werd ichs hören?"}]},{"wer":"Zweite Magd","zeilen":[{"v":222,"t":"Ei, Ihr kamt ja,"},{"v":223,"t":"Besinnt Euch, ohne die Perück ins Haus."}]},{"wer":"Adam","zeilen":[{"v":224,"t":"Ich, ohne die Perücke?"}]},{"wer":"Zweite Magd","zeilen":[{"v":224,"t":"In der Tat."},{"v":225,"t":"Da ist die Liese, die's bezeugen kann."},{"v":226,"t":"Und Eure andr ist beim Perückenmacher."}]},{"wer":"Adam","zeilen":[{"v":227,"t":"Ich wär--?"}]},{"wer":"Erste Magd","zeilen":[{"v":227,"t":"Ja, meiner Treu, Herr Richter Adam!"},{"v":228,"t":"Kahlköpfig wart Ihr, als Ihr wiederkamt;"},{"v":229,"t":"Ihr spracht, Ihr wärt gefallen, wißt Ihr nicht?"},{"v":230,"t":"Das Blut mußt ich Euch noch vom Kopfe waschen."}]},{"wer":"Adam","zeilen":[{"v":231,"t":"Die Unverschämte!"}]},{"wer":"Erste Magd","zeilen":[{"v":231,"t":"Ich will nicht ehrlich sein."}]},{"wer":"Adam","zeilen":[{"v":232,"t":"Halts Maul, sag ich, es ist kein wahres Wort."}]},{"wer":"Licht","zeilen":[{"v":233,"t":"Habt Ihr die Wund seit gestern schon?"}]},{"wer":"Adam","zeilen":[{"v":233,"t":"Nein, heut."},{"v":234,"t":"Die Wunde heut und gestern die Perücke."},{"v":235,"t":"Ich trug sie weiß gepudert auf dem Kopfe,"},{"v":236,"t":"Und nahm sie mit dem Hut, auf Ehre, bloß,"},{"v":237,"t":"Als ich ins Haus trat, aus Versehen ab."},{"v":238,"t":"Was die gewaschen hat, das weiß ich nicht."},{"v":239,"t":"--Scher dich zum Satan, wo du hingehörst!"},{"v":240,"t":"In die Registratur!"}]},{"regie":"Erste Magd ab."},{"wer":"Adam","zeilen":[{"v":240,"t":"Geh, Margarete!"},{"v":241,"t":"Gevatter Küster soll mir seine borgen;"}]}]},{"id":"S8-B","abschnitt":"2. Auftritt","szene":"Wo ist die Perücke?","bild":"hoch/S8-B.webp","alt":"Unter dem Bett schlafen fünf Kätzchen in der Perücke","ebenen":null,"video":null,"sonder":"katzen","einstellung":null,"punkte":null,"effekte":[],"soundwort":null,"schritte":[{"art":"blase","id":"S8-B-1","wer":"Adam","seite":"links","original":["In meine hätt die Katze heute morgen","Gejungt, das Schwein!"],"heute":"In meine Perücke hat die Katze heute Morgen ihre Jungen geworfen, das Biest!","vers":[242,243],"fokus":null,"audio":null},{"art":"blase","id":"S8-B-2","wer":"Adam","seite":"rechts","original":["Fünf Junge, gelb und schwarz, und eins ist weiß."],"heute":"Fünf Kätzchen: gelbe, schwarze und ein weißes.","vers":[246,246],"fokus":null,"audio":null},{"art":"merke","text":"Wieder eine Ausrede mit auffällig vielen Einzelheiten."}]},{"id":"S8-Bb","art":"bruecke","abschnitt":"2. Auftritt","szene":"Wo ist die Perücke?","hintergrund":"S8-B","vers":[243,264],"titel":"Die Katze war's","kurz":"Adam spinnt die Katzengeschichte weiter: Die Perücke sei nachts vom Stuhl gefallen, und die Katze habe darin ihre Jungen bekommen. Licht hilft spöttisch nach und fragt, wer die Perücke wohl unters Bett getragen hat. Adam verheddert sich.\n\nDann schickt er die Magd zur Küsterin: Die geliehene Perücke komme noch heute zurück, der Küster selbst solle nichts erfahren.","merke":"Licht stellt Fangfragen wie ein Richter, und Adam verstrickt sich wie ein Angeklagter (V. 253–256). Die Rollen sind schon vertauscht, bevor der Prozess beginnt.","heute":[{"wer":"Adam","text":"… geworfen, das Biest! Sie liege verdreckt unter meinem Bett, das weiß ich jetzt."},{"wer":"Licht","text":"Die Katze? Was? Sind Sie …?"},{"wer":"Adam","text":"So wahr ich lebe. Fünf Junge, gelbe und schwarze, und eins ist weiß. Die schwarzen will ich in der Vecht ertränken. Was soll man machen? Wollen Sie eins haben?"},{"wer":"Licht","text":"In die Perücke?"},{"wer":"Adam","text":"Der Teufel soll mich holen! Ich hatte die Perücke auf einen Stuhl gehängt, als ich ins Bett ging. In der Nacht stoße ich an den Stuhl, sie fällt …"},{"wer":"Licht","text":"Dann nimmt die Katze sie ins Maul …"},{"wer":"Adam","text":"Bei meiner Seele …"},{"wer":"Licht","text":"… und trägt sie unters Bett und wirft darin ihre Jungen."},{"wer":"Adam","text":"Ins Maul? Nein …"},{"wer":"Licht","text":"Nicht? Wie denn sonst?"},{"wer":"Adam","text":"Die Katze? Ach was!"},{"wer":"Licht","text":"Nicht? Oder vielleicht Sie selbst?"},{"wer":"Adam","text":"Ins Maul! Ich glaube, ich habe sie heute mit dem Fuß hinuntergestoßen, als ich es sah."},{"wer":"Licht","text":"Gut, gut."},{"wer":"Adam","text":"Diese Biester! Die paaren sich und werfen, wo gerade Platz ist."},{"regie":"Die zweite Magd kichert."},{"wer":"Zweite Magd","text":"Soll ich gehen?"},{"wer":"Adam","text":"Ja, und einen Gruß von mir an die Küsterin, Muhme Schwarzgewand. Ich schicke ihr die Perücke noch heute unversehrt zurück. Ihm brauchst du nichts zu sagen. Verstehst du mich?"},{"wer":"Zweite Magd","text":"Ich richte es schon aus."},{"regie":"Ab."}],"original":[{"wer":"Adam","zeilen":[{"v":243,"t":"Gejungt, das Schwein!  Sie läge eingesäuet"},{"v":244,"t":"Mir unterm Bette da, ich weiß nun schon."}]},{"wer":"Licht","zeilen":[{"v":245,"t":"Die Katze?  Was?  Seid Ihr--?"}]},{"wer":"Adam","zeilen":[{"v":245,"t":"So wahr ich lebe."},{"v":246,"t":"Fünf Junge, gelb und schwarz, und eins ist weiß."},{"v":247,"t":"Die schwarzen will ich in der Vecht ersäufen."},{"v":248,"t":"Was soll man machen?  Wollt Ihr eine haben?"}]},{"wer":"Licht","zeilen":[{"v":249,"t":"In die Perücke?"}]},{"wer":"Adam","zeilen":[{"v":249,"t":"Der Teufel soll mich holen!"},{"v":250,"t":"Ich hatte die Perücke aufgehängt,"},{"v":251,"t":"Auf einen Stuhl, da ich zu Bette ging,"},{"v":252,"t":"Den Stuhl berühr ich in der Nacht, sie fällt--"}]},{"wer":"Licht","zeilen":[{"v":253,"t":"Drauf nimmt die Katze sie ins Maul--"}]},{"wer":"Adam","zeilen":[{"v":253,"t":"Mein Seel--"}]},{"wer":"Licht","zeilen":[{"v":254,"t":"Und trägt sie unters Bett und jungt darin."}]},{"wer":"Adam","zeilen":[{"v":255,"t":"Ins Maul?  Nein--"}]},{"wer":"Licht","zeilen":[{"v":255,"t":"Nicht?  Wie sonst?"}]},{"wer":"Adam","zeilen":[{"v":255,"t":"Die Katz?  Ach, was!"}]},{"wer":"Licht","zeilen":[{"v":256,"t":"Nicht?  Oder Ihr vielleicht?"}]},{"wer":"Adam","zeilen":[{"v":256,"t":"Ins Maul!  Ich glaube"},{"v":257,"t":"Ich stieß sie mit dem Fuße heut hinunter,"},{"v":258,"t":"Als ich es sah."}]},{"wer":"Licht","zeilen":[{"v":258,"t":"Gut, gut."}]},{"wer":"Adam","zeilen":[{"v":258,"t":"Kanaillen die!"},{"v":259,"t":"Die balzen sich und jungen, wo ein Platz ist."}]},{"wer":"Zweite Magd","regie":"kichernd","zeilen":[{"v":260,"t":"Soll ich hingehn?"}]},{"wer":"Adam","zeilen":[{"v":260,"t":"Ja, und meinen Gruß"},{"v":261,"t":"An Muhme Schwarzgewand, die Küsterin."},{"v":262,"t":"Ich schickt ihr die Perücke unversehrt"},{"v":263,"t":"Noch heut zurück, ihm brauchst du nichts zu sagen."},{"v":264,"t":"Verstehst du mich?"}]},{"wer":"Zweite Magd","zeilen":[{"v":264,"t":"Ich werd es schon bestellen."}]},{"regie":"Ab."}]},{"id":"S8-C","abschnitt":"2. Auftritt","szene":"Wo ist die Perücke?","bild":"hoch/S8-C.webp","alt":"Nahaufnahme im Dunkeln: Lichts zusammengekniffenes, misstrauisches Auge","ebenen":null,"video":null,"einstellung":"creep","punkte":[[65,53,1.25]],"effekte":[],"soundwort":null,"schritte":[]},{"id":"S8-D","abschnitt":"Vorschau","szene":"Vor dem Gericht","bild":"hoch/S8-D.webp","alt":"Frau Marthe hält wütend den zerbrochenen Krug hoch, hinter ihr Eve und Ruprecht","ebenen":[{"art":"bg","datei":"ebenen/S8-D-bg.webp"},{"art":"mg","datei":"ebenen/S8-D-mg.webp"},{"art":"fg","datei":"ebenen/S8-D-fg.webp"}],"video":{"datei":"videos/S8-D.mp4","ende":"hoch/S8-D-end.webp"},"einstellung":"pan","punkte":[[75,25,1.6],[22,33,1.9]],"effekte":[],"soundwort":null,"schritte":[{"art":"kasten","text":"Später, vor der Tür des Gerichts:"},{"art":"blase","id":"S8-D-1","wer":"Frau Marthe","seite":"rechts","original":["Ihr krugzertrümmerndes Gesindel, ihr!","Ihr sollt mir büßen, ihr!"],"heute":"Ihr Krugzerschmeißer, ihr Gesindel! Das werdet ihr mir büßen!","vers":[414,415],"fokus":[50,42,1.5],"ruck":true,"audio":null}]}]},"klausur":{"format":1,"folge":1,"hinweis":"Klausur-Paket zu Folge 1 (1. und 2. Auftritt, V. 1–264). Ausblicke auf spätere Handlung erlaubt (nur hier, nicht in Merksätzen). Zitate gegen quelle/ und die Reclam-Verszählung geprüft; Lösungen mit den Punkten „Sprache und Form:“, „Kontext:“, „Für 13 bis 15 Punkte:“, „Häufiger Fehler:“ (werkzeug/pruefe_klausur.py).","marken":[{"karte":"S1-D","vers":[5,6],"zitat":"Gestrauchelt bin ich hier; denn jeder trägt / Den leid'gen Stein zum Anstoß in sich selbst.","warum":"Adam redet von Schuld, bevor ihn jemand beschuldigt. Der Satz ist der Schlüssel zum Motiv Schuld im ganzen Stück."},{"karte":"S2-A","vers":[9,11],"zitat":"Ihr stammt von einem lockern Ältervater, / Der so beim Anbeginn der Dinge fiel, / Und wegen seines Falls berühmt geworden;","warum":"Licht verbindet Adams Sturz mit dem biblischen Sündenfall. Wer über den Namen Adam oder das Motiv des Falls schreibt, zitiert hier."},{"karte":"S2-C","vers":[14,15],"zitat":"Ja, unbildlich. / Es mag ein schlechtes Bild gewesen sein.","warum":"Wortspiel mit „Fall“ und „Bild“: wörtlich gestürzt, bildlich gesündigt. Typische Stelle für Aufgaben zur Sprache."},{"karte":"S2-Cb","vers":[24,24],"zitat":"Der ohnehin schwer den Weg der Sünde wandelt?","warum":"Licht macht aus dem Klumpfuß ein Zeichen der Sünde. Beleg für die religiösen Anspielungen der Exposition."},{"karte":"S4-A","vers":[50,51],"zitat":"Mit dem verfluchten Ziegenbock / Am Ofen focht ich, wenn Ihr wollt. Jetzt weiß ichs.","warum":"„Jetzt weiß ichs“ verrät, dass Adam die Erklärung gerade erfindet. Kernstelle zum Motiv Wahrheit und Lüge."},{"karte":"S4-E","vers":[62,63],"zitat":"Der erste Adamsfall, / Den Ihr aus einem Bett hinaus getan.","warum":"Licht greift den Sündenfall noch einmal auf und spottet. Zeigt, dass Licht mehr ahnt, als er sagt."},{"karte":"S6-B","vers":[128,129],"zitat":"Zu Mittag! Gut, Gevatter! Jetzt gilts Freundschaft. / Ihr wißt, wie sich zwei Hände waschen können.","warum":"Adam bietet Licht einen Handel an. Kernstelle zum Motiv Recht: Der Richter setzt auf Gefälligkeit statt auf Gesetz."},{"karte":"S8-Ab","vers":[228,230],"zitat":"Kahlköpfig wart Ihr, als Ihr wiederkamt; / Ihr spracht, Ihr wärt gefallen, wißt Ihr nicht? / Das Blut mußt ich Euch noch vom Kopfe waschen.","warum":"Die Magd widerspricht Adam: Er kam schon gestern Nacht verletzt und ohne Perücke nach Hause. Wichtigster Widerspruch der Folge."}],"fragen":[{"operator":"analysieren","aufgabe":"Analysieren Sie, wie im Gespräch zwischen Adam und Licht (V. 1–30) Adams Sturz mit dem biblischen Sündenfall verknüpft wird.","selbsttest":{"frage":"Wen meint Licht mit dem „lockern Ältervater“?","optionen":["Den biblischen Adam, der im Paradies „fiel“.","Adams Großvater, der auch Richter war.","Den Richter von Holla.","Den Gerichtsrat Walter."],"richtig":0,"erklaerung":"Richtig: der Ältervater, „Der so beim Anbeginn der Dinge fiel“ (V. 10), ist der erste Mensch Adam. Der Richter trägt denselben Namen."},"erwartung":["Situation: Exposition am frühen Morgen. Licht findet den Richter verletzt vor und fragt: „Was ist mit Euch geschehn? Wie seht Ihr aus?“ (V. 2).","Adam spricht von sich aus von Schuld: „denn jeder trägt / Den leid'gen Stein zum Anstoß in sich selbst.“ (V. 5 f.). Der „Stein des Anstoßes“ ist ein biblisches Bild für Sünde.","Licht deutet den Namen: Adam stamme von einem „Ältervater“, der „wegen seines Falls berühmt geworden“ sei (V. 9–11).","Wortspiel: Licht fragt „Unbildlich hingeschlagen?“ (V. 14), Adam antwortet „Es mag ein schlechtes Bild gewesen sein.“ (V. 15). „Fall“ heißt zugleich Sturz und Sünde.","Der Klumpfuß wird zum Zeichen: der Fuß, „Der ohnehin schwer den Weg der Sünde wandelt“ (V. 24).","Form: Blankvers; viele geteilte Verse (V. 8, 12) und Gedankenstriche („Ob ich--? Ich glaube--!“, V. 12) zeigen, wie Adam ausweicht und Licht nachbohrt.","Deutung: Das Publikum ahnt früh, dass hinter dem Sturz eine Schuld steckt. Die Komik entsteht daraus, dass Adam die Anspielungen abwehren muss.","Sprache und Form: Licht führt das Gespräch durch Fragen, Adam antwortet nur. Fast jeder Beitrag Lichts endet mit einem Fragezeichen (V. 2, 7, 12, 14, 16, 22–25). Das ist schon ein Verhör: Der Schreiber vernimmt den Richter.","Sprache und Form: Adam nimmt Bilder wörtlich, um ihnen auszuweichen. Aus dem Weg der Sünde macht er einen Fuß, der „ein Klumpen“ (V. 26) ist. Licht tut das Gegenteil: Er macht aus dem wörtlichen Sturz ein Bild. Die Komik der Stelle liegt in diesem Hin und Her zwischen wörtlich und bildlich.","Kontext: Der „Stein des Anstoßes“ stammt aus der Bibel (Jesaja 8,14). Der Klumpfuß erinnert an den Pferdefuß des Teufels und an Ödipus, dessen Name „Schwellfuß“ bedeutet.","Kontext: Uraufführung 1808 in Weimar unter Goethes Leitung, ohne Erfolg. Kleist steht zwischen Klassik und Romantik und lässt sich keiner der beiden Epochen glatt zuordnen. Das darf man in der Klausur so schreiben.","Für 13 bis 15 Punkte: Lichts Rolle abwägen. Er fragt wie ein besorgter Freund, stichelt aber gezielt (V. 9–12, V. 24). Ob er schon etwas weiß oder nur ahnt, lässt der Text offen. Wer beide Lesarten mit Versen stützt und sich dann entscheidet, zeigt eigenes Urteil. Dazu gehört: Adams Satz vom Stein (V. 5 f.) ist Ausrede und Wahrheit zugleich. Er sagt mehr, als er sagen will.","Häufiger Fehler: Die Anspielungen nur aufzählen, ohne ihre Wirkung zu nennen. Oder Adam schon hier als überführten Täter behandeln: In V. 1–30 weiß das Publikum noch von keiner Tat."],"vorgriff":"Im Prozess zeigt sich, dass Adam selbst der Täter ist, den er als Richter finden soll: Richter und Täter zugleich. Kleist vergleicht in seiner Vorrede den Schreiber mit Kreon und den Richter mit Ödipus. Anders als Ödipus will Adam die Wahrheit aber gerade verhindern.","sprung":{"karte":"S2-A","text":"1. Auftritt · Der erste Adam"}},{"operator":"charakterisieren","aufgabe":"Charakterisieren Sie Adam anhand seines Umgangs mit der Wahrheit im 1. und 2. Auftritt.","selbsttest":{"frage":"Woran merkt man, dass Adam die Geschichte vom Ziegenbock erfindet?","optionen":["Licht holt einen Zeugen.","Der Ziegenbock steht noch im Zimmer.","Er sagt mitten in der Erklärung: „Jetzt weiß ichs.“","Adam gibt die Lüge am Ende zu."],"richtig":2,"erklaerung":"Richtig: „Am Ofen focht ich, wenn Ihr wollt. Jetzt weiß ichs.“ (V. 51). Wer sich erinnert, muss das nicht erst „jetzt“ wissen."},"erwartung":["Erste Version: Er sei gestürzt, „da ich dem Bett / Entsteig“ (V. 17 f.), und schiebt es auf Gott: „Renkt unser Herrgott mir den Fuß schon aus.“ (V. 21).","Zweite Version, sichtbar improvisiert: „Mit dem verfluchten Ziegenbock / Am Ofen focht ich, wenn Ihr wollt. Jetzt weiß ichs.“ (V. 50 f.).","Übertreibung durch Details: „Und häuptlings mit dem Stirnblatt schmettr ich auf / Den Ofen hin“ (V. 59 f.). Je genauer die Ausrede, desto unglaubwürdiger.","Widerspruch durch die Magd: Er kam gestern ohne Perücke heim, „Das Blut mußt ich Euch noch vom Kopfe waschen.“ (V. 230). Adam dagegen: „Die Wunde heut und gestern die Perücke.“ (V. 234).","Neue Ausrede mit vielen Einzelheiten: Die Katze habe in der Perücke „Gejungt“ (V. 243), „Fünf Junge, gelb und schwarz, und eins ist weiß.“ (V. 246).","Er dreht den Vorwurf um und sagt zu Licht: „Ihr gebt Euch bloß, Gevatter.“ (V. 213) und „Ihr seid verlegen.“ (V. 214).","Ergebnis: Adam ist schlagfertig, aber nicht geschickt. Er lügt spontan, verstrickt sich und verrät sich durch zu viele Einzelheiten.","Sprache und Form: Adams Ausreden haben ein Muster. Erst ein Schreckmoment in kurzen Ausrufen: „Gefecht! Was?“ (V. 50), „Ich, ohne die Perücke?“ (V. 224). Dann eine lange, flüssige Erzählung (V. 52–61, V. 250–252). Die Länge soll überzeugen und verrät nur den Aufwand.","Sprache und Form: Wo gelogen wird, häufen sich Beteuerungen: „auf Ehre“ (V. 236), „So wahr ich lebe.“ (V. 245), „Der Teufel soll mich holen!“ (V. 249). Die Mägde stützen ihre Aussage dagegen auf Uhrzeit und Zeugin (V. 222, V. 225).","Die Erklärungen passen nicht zusammen: Die Perücke will Adam am Abend „aus Versehen“ (V. 237) mit dem Hut abgenommen haben, kurz darauf soll die Katze „heute morgen“ (V. 242) darin gejungt haben. Licht glaubt kein Wort und erzählt die Katzengeschichte spöttisch selbst zu Ende (V. 253 f.).","Kontext: Der Krug ist ein analytisches Drama: Die Tat liegt vor Beginn, die Handlung deckt sie auf. Vorbild ist der „König Ödipus“ von Sophokles. Dort sucht der Richter die Wahrheit und findet sich selbst. Hier kennt der Richter die Wahrheit und will sie verdecken. So wird aus dem Bau einer Tragödie eine Komödie.","Für 13 bis 15 Punkte: Adam nicht nur als Lügner abtun. Er ist erfinderisch und schlagfertig, das macht die Komik aus. Abwägen: Ist er ein gerissener Täuscher oder ein Getriebener, der von Ausrede zu Ausrede stolpert? Für das Zweite sprechen „Jetzt weiß ichs.“ (V. 51) und „Was tu ich jetzt? Was laß ich?“ (V. 170).","Häufiger Fehler: Die Ausreden nacherzählen, statt zu zeigen, woran man die Lüge erkennt. Und: aus diesen beiden Auftritten schon „beweisen“, dass Adam den Krug zerbrochen hat. Bis V. 264 fällt das Wort Krug kein einziges Mal."],"vorgriff":"Vor Gericht muss Adam über genau die Nacht urteilen, in der er sich verletzt hat. Seine Ausreden werden dort immer gewagter, bis die Wahrheit nicht mehr zu verbergen ist.","sprung":{"karte":"S4-A","text":"1. Auftritt · Die Ausrede"}},{"operator":"erläutern","aufgabe":"Erläutern Sie, welches Bild von Recht und Gericht im 1. und 2. Auftritt entsteht.","selbsttest":{"frage":"Warum erschrickt Adam über die Nachricht aus Holla?","optionen":["In Holla wurde ein Krug zerbrochen.","Der Gerichtsrat hat dort Richter und Schreiber vom Amt suspendiert.","Licht soll dort Richter werden.","Walter hat in Holla einen Unfall gehabt."],"richtig":1,"erklaerung":"Richtig: Walter „suspendierte Richter dort und Schreiber“ (V. 104). Das droht nun auch in Huisum."},"erwartung":["Kontrolle von oben: Gerichtsrat Walter ist „in Revisions-Bereisung auf den Ämtern“ (V. 70) und hat in Holla Richter und Schreiber suspendiert (V. 102–104).","Adams Rechtsverständnis: Man praktiziere „nach den / Bestehenden Edikten und Gebräuchen“ (V. 99 f.). Gemeint ist Gewohnheit, nicht genaue Rechtspflege.","Gefälligkeit statt Gesetz: „Ihr wißt, wie sich zwei Hände waschen können.“ (V. 129). Adam lockt Licht mit dem Richteramt (V. 130 f.).","Zustand des Amts: Die Akten „liegen wie der Turm zu Babylon“ (V. 162), in der Registratur liegen Lebensmittel (V. 194 f.). Adam nennt eine Wurst „Pupillenakten“ (V. 216).","Licht ist kein reines Gegenbild: Adam spricht offen seinen „Ehrgeiz“ an (V. 138), Licht wehrt nur knapp ab: „Dorfrichter, ich! Was denkt Ihr auch von mir?“ (V. 134). Adams Andeutung „Von Depositionen sich und Zinsen“ (V. 149) lässt weitere Unregelmäßigkeiten im Amt ahnen.","Deutung: Das Gericht in Huisum ist ein Ort der Unordnung und der Abhängigkeiten. Mit Walter tritt ein Prüfer auf, an dem sich Adams Amtsführung messen lassen muss.","Sprache und Form: Zwei Wortschätze stehen gegeneinander. Adam spricht über das Amt in derber Alltagssprache: „Sein Schäfchen schiert“ (V. 79), „kujonieren“ (V. 80). Die Amtssprache kommt mit der Nachricht von Walter: „Revisions-Bereisung“ (V. 70), „suspendierte“ (V. 104), „ab officio“ (V. 105). Dahinter stehen zwei Auffassungen vom Recht.","Sprache und Form: Die Vergleiche sind komisch, weil sie zu groß sind für das Dorf: der „Turm zu Babylon“ (V. 162) für Aktenstöße, der Redner Demosthenes (V. 142 f.) für einen Schreiber, der schweigen soll, das Bibelwort „den Kelch vorübergehn“ (V. 133) für ein verschobenes Amt.","Der Richter von Holla als Spiegel: Er wurde suspendiert und fand sich „Am Sparren hoch des Daches aufgehangen.“ (V. 111); man rettete ihn. Adam nennt ihn „Ein liederlicher Hund“ (V. 119) und im selben Atemzug „eine ehrliche Haut“ (V. 120). So milde urteilt, wer sich selbst gemeint weiß.","Kontext: Um 1800 wurde in Preußen um die Reform von Verwaltung und Justiz gerungen; Kleist kannte den Staatsdienst aus eigener Erfahrung. Walter steht für ein überprüfbares Recht, Adam für das Gewohnheitsrecht auf dem Land („Gebräuchen“, V. 100). Dass das Stück in den Niederlanden spielt, rückt die Kritik ein Stück von Preußen weg.","Für 13 bis 15 Punkte: Walter nicht vorschnell zum Ideal erklären. In diesen Auftritten kennt man ihn nur aus Berichten, und die fallen verschieden aus: Für Licht ist er der strenge Prüfer (V. 102–104), für Adam einer, der „praktisiert, wie wir“ (V. 99). Eine sehr gute Arbeit fragt, ob Kontrolle von oben schon Gerechtigkeit ist, und begründet ihre Antwort.","Häufiger Fehler: Nur Adam betrachten. Zum Bild des Gerichts gehören auch Licht, die Mägde und der Zustand der Registratur. Und: „Revision“ mit dem heutigen Rechtsmittel verwechseln. Gemeint ist eine Dienstaufsicht vor Ort."],"vorgriff":"Walter sitzt beim folgenden Prozess dabei und greift immer wieder ein. Recht gegen Willkür bleibt ein Hauptmotiv bis zum Schluss.","sprung":{"karte":"S6-B","text":"1. Auftritt · Zwei Hände"}}],"zitate":[{"zitat":"Zum Straucheln brauchts doch nichts als Füße.","luecke":"Füße","vers":[3,3],"wer":"Adam","wo":"1. Auftritt","deutung":"Adams erste Ausrede: Hinfallen ist ganz normal. Er spielt den Sturz herunter."},{"zitat":"Gestrauchelt bin ich hier; denn jeder trägt / Den leid'gen Stein zum Anstoß in sich selbst.","luecke":"Stein","vers":[5,6],"wer":"Adam","wo":"1. Auftritt","deutung":"Biblisches Bild für Sünde. Adam spricht von Schuld, bevor jemand ihn fragt."},{"zitat":"Ihr stammt von einem lockern Ältervater, / Der so beim Anbeginn der Dinge fiel, / Und wegen seines Falls berühmt geworden;","luecke":"Falls","vers":[9,11],"wer":"Licht","wo":"1. Auftritt","deutung":"Anspielung auf den Sündenfall. Der Name Adam wird zum Programm."},{"zitat":"Ja, unbildlich. / Es mag ein schlechtes Bild gewesen sein.","luecke":"Bild","vers":[14,15],"wer":"Adam","wo":"1. Auftritt","deutung":"Wortspiel: wörtlicher Sturz gegen bildlichen Fall. Adam stolpert auch sprachlich."},{"zitat":"Der ohnehin schwer den Weg der Sünde wandelt?","luecke":"Sünde","vers":[24,24],"wer":"Licht","wo":"1. Auftritt","deutung":"Der Klumpfuß wird zum Zeichen der Sünde. Licht stichelt mit frommen Worten."},{"zitat":"Ein Fuß ist, wie der andere, ein Klumpen.","luecke":"Klumpen","vers":[26,26],"wer":"Adam","wo":"1. Auftritt","deutung":"Adam wehrt die Anspielung ab, indem er sie wörtlich nimmt."},{"zitat":"Ja, ja! So gehts im Feuer des Gefechts.","luecke":"Gefechts","vers":[49,49],"wer":"Licht","wo":"1. Auftritt","deutung":"Licht deutet einen Kampf an. Adam erschrickt und braucht sofort eine Erklärung."},{"zitat":"Am Ofen focht ich, wenn Ihr wollt. Jetzt weiß ichs.","luecke":"weiß","vers":[51,51],"wer":"Adam","wo":"1. Auftritt","deutung":"Die Ausrede entsteht beim Sprechen. „Jetzt“ verrät die Lüge."},{"zitat":"Der erste Adamsfall, / Den Ihr aus einem Bett hinaus getan.","luecke":"Adamsfall","vers":[62,63],"wer":"Licht","wo":"1. Auftritt","deutung":"Licht verbindet Sturz und Sündenfall noch einmal, diesmal offen spöttisch."},{"zitat":"Ihr wißt, wie sich zwei Hände waschen können.","luecke":"Hände","vers":[129,129],"wer":"Adam","wo":"1. Auftritt","deutung":"Redensart für Gefälligkeit gegen Gefälligkeit. Adam will Licht kaufen."},{"zitat":"Ein Schwank ists etwa, der, zur Nacht geboren, / Des Tags vorwitz'gen Lichtstrahl scheut.","luecke":"Nacht","vers":[154,155],"wer":"Adam","wo":"1. Auftritt","deutung":"Was in der Nacht geschah, soll nicht ans Licht. Im „Lichtstrahl“ steckt auch der Name des Schreibers."},{"zitat":"Die liegen wie der Turm zu Babylon.","luecke":"Babylon","vers":[162,162],"wer":"Adam","wo":"1. Auftritt","deutung":"Biblischer Vergleich für das Chaos in den Akten. So steht es um Adams Gericht."},{"zitat":"Ihr gebt Euch bloß, Gevatter.","luecke":"bloß","vers":[213,213],"wer":"Adam","wo":"2. Auftritt","deutung":"Adam wirft Licht vor, sich zu verraten. In Wahrheit verrät er sich selbst."},{"zitat":"Das sind Pupillenakten.","luecke":"Pupillenakten","vers":[216,216],"wer":"Adam","wo":"2. Auftritt","deutung":"Eine Wurst wird zur Mündelakte erklärt. Komik aus der Unordnung im Amt."},{"zitat":"Die Wunde heut und gestern die Perücke.","luecke":"Wunde","vers":[234,234],"wer":"Adam","wo":"2. Auftritt","deutung":"Adam trennt, was zusammengehört. Die Magd hat das Gegenteil bezeugt (V. 228–230)."}],"begriffe":[{"begriff":"Lustspiel","erklaerung":"Komödie. Der Krug ist eines der bekanntesten deutschen Lustspiele (1808 uraufgeführt)."},{"begriff":"Exposition","erklaerung":"Einführung in Figuren, Ort und Konflikt. Hier: der verletzte Richter und der angekündigte Besuch."},{"begriff":"Analytisches Drama","erklaerung":"Die entscheidende Tat ist schon vor Beginn geschehen und wird nach und nach aufgedeckt."},{"begriff":"Blankvers","erklaerung":"Reimloser Vers mit fünf Hebungen (fünfhebiger Jambus). Grundform des Stücks."},{"begriff":"Geteilter Vers (Antilabe)","erklaerung":"Mehrere Figuren teilen sich eine Verszeile, z. B. V. 8 und V. 12. Das macht das Gespräch schnell."},{"begriff":"Anspielung","erklaerung":"Indirekter Verweis, hier auf die Bibel: Sündenfall, Stein des Anstoßes, Turm zu Babel."},{"begriff":"Wortspiel","erklaerung":"Spiel mit zwei Bedeutungen eines Wortes, etwa „Fall“ als Sturz und als Sünde."},{"begriff":"Sprechender Name","erklaerung":"Der Name deutet die Figur: Adam (der erste Sünder), Licht (der etwas ans Licht bringen könnte)."},{"begriff":"Dramatische Ironie","erklaerung":"Das Publikum ahnt mehr als die Figuren auf der Bühne zugeben."},{"begriff":"Revision","erklaerung":"Prüfung eines Gerichts durch die vorgesetzte Behörde. Walter reist dafür über die Dörfer."},{"begriff":"Suspendieren","erklaerung":"Jemanden vorläufig aus dem Amt nehmen. So geschah es dem Richter in Holla."},{"begriff":"Gevatter","erklaerung":"Pate oder vertrauter Bekannter. Die Anrede zeigt, wie eng Adam und Licht miteinander umgehen."}],"fahrplan":[{"titel":"Die Aufgabenarten","text":"Im Abitur Deutsch gibt es nach den Vorgaben der Kultusministerkonferenz: Interpretation literarischer Texte, Analyse pragmatischer Texte, Erörterung literarischer oder pragmatischer Texte und materialgestütztes Schreiben. Der Krug ist ländergemeinsame Pflichtlektüre. Dann gilt oft: Teilaufgabe 1 ist die Interpretation eines unbekannten Textes, Teilaufgabe 2 stellt den Bezug zum Krug her, meist als Motivvergleich (Schuld, Wahrheit, Recht). Möglich ist auch die Interpretation eines Auszugs aus dem Krug selbst. In Baden-Württemberg, Hessen und Nordrhein-Westfalen gehört der 12. Auftritt in beiden Fassungen dazu (gekürzt und „Variant“)."},{"titel":"Die Operatoren","text":"Das Verb in der Aufgabe sagt, was du tun sollst. Einordnen: die Stelle in den Handlungsverlauf stellen. Analysieren: Inhalt, Aufbau, Sprache und Form untersuchen und zeigen, wie sie zusammenwirken. Interpretieren: auf Grundlage der Analyse zu einer schlüssigen Gesamtdeutung kommen. Charakterisieren: die Eigenart einer Figur herausarbeiten. Erläutern: einen Zusammenhang begründen und mit Textbeispielen veranschaulichen. Vergleichen: Gemeinsamkeiten und Unterschiede herausarbeiten und gewichten. Erörtern: eine These mit Argumenten und Gegenargumenten prüfen und zu einem Urteil kommen."},{"titel":"Worauf es Punkte gibt","text":"Richtwert bei Interpretationsaufgaben: Verstehen ca. 70 %, Darstellung ca. 30 %. Zur Darstellung zählen Aufbau, Fachsprache, Umgang mit dem Text (also Zitieren), Ausdruck und Rechtschreibung. Nacherzählen allein reicht nicht."},{"titel":"Die drei Motive für den Vergleich","text":"Schuld: „denn jeder trägt / Den leid'gen Stein zum Anstoß in sich selbst.“ (V. 5 f.); der Sündenfall als Bild (V. 9–11, V. 62 f.).\nWahrheit: Adams Ausreden (V. 50 f., V. 242 f.) gegen die Aussage der Magd (V. 228–230).\nRecht: Revision und Suspendierung in Holla (V. 102–104) gegen Adams „zwei Hände“ (V. 129).\nIn Teilaufgabe 2 hilft es, zu jedem Motiv eine Stelle aus dem Krug sicher zu kennen."},{"titel":"Gelöste Beispielaufgabe: Die Aufgabe","text":"1. Ordnen Sie den Auszug über Adams Ausrede (V. 49–63) in den Handlungszusammenhang ein und interpretieren Sie ihn (ca. 60 %). 2. Vergleichen Sie Adams Erklärung seiner Verletzung mit der Aussage der Magd im 2. Auftritt (V. 221–238) (ca. 40 %). Eigene Übungsaufgabe im Stil des Abiturs, keine Originalaufgabe."},{"titel":"Beispiel: Einleitung","text":"Der Auszug stammt aus Heinrich von Kleists Lustspiel „Der zerbrochne Krug“ (Uraufführung 1808), 1. Auftritt. Der Schreiber Licht findet Dorfrichter Adam am Morgen verletzt vor und hat seinen Sturz schon mit dem Sündenfall in Verbindung gebracht. Deutungshypothese: Die Szene zeigt, wie Adam eine Erklärung erfindet und sich gerade durch ihre Genauigkeit verdächtig macht."},{"titel":"Beispiel: Ablauf und Sprache","text":"Licht stichelt: „So gehts im Feuer des Gefechts.“ (V. 49). Adam schreckt auf („Gefecht! Was?“, V. 50) und liefert sofort eine Erklärung: „Mit dem verfluchten Ziegenbock / Am Ofen focht ich, wenn Ihr wollt. Jetzt weiß ichs.“ (V. 50 f.). „Wenn Ihr wollt“ und „Jetzt weiß ichs“ zeigen, dass er improvisiert. Dann folgt eine lange, genaue Schilderung: Er habe die nassen Hosen gegriffen (V. 54 f.), dann: „Der Bund; Bund jetzt und Hos und ich, wir stürzen,“ (V. 58). Er schlug „häuptlings mit dem Stirnblatt“ auf den Ofen (V. 59). Licht kommentiert spöttisch: „Der erste Adamsfall“ (V. 62)."},{"titel":"Beispiel: Deutung","text":"Die Komik entsteht aus dem Widerspruch zwischen Aufwand und Glaubwürdigkeit: Je mehr Einzelheiten Adam erfindet, desto weniger glaubt man ihm. Der Blankvers wird durch Ausrufe und Brüche zerrissen. Lichts Rückgriff auf den Sündenfall zeigt, dass er mehr ahnt, als er sagt."},{"titel":"Beispiel: Vergleich","text":"Die Magd erzählt nüchtern und mit Uhrzeit: „Gestern abend-- / Glock elf--“ (V. 221 f.), Adam kam „ohne die Perück ins Haus“ (V. 223), und sie musste ihm das Blut „vom Kopfe waschen“ (V. 230). Adam behauptet dagegen, die Wunde stamme von „heut“ (V. 233). Gemeinsam ist beiden Fassungen der Sturz, verschieden sind Zeit und Ort. Die Aussage der Magd zerstört Adams Ziegenbock-Geschichte, denn die spielte am Morgen."},{"titel":"Beispiel: Schluss","text":"Der Auszug legt die Spur für das ganze Stück: Adam verbirgt etwas aus der vergangenen Nacht. Ausblick: Im folgenden Prozess wird genau diese Nacht verhandelt, und Adam sitzt als Richter über seine eigene Tat."},{"titel":"Richtig zitieren","text":"Wörtlich in Anführungszeichen, Vers dahinter: „Ihr wißt, wie sich zwei Hände waschen können.“ (V. 129). Zwei Verse: „Ja, unbildlich. / Es mag ein schlechtes Bild gewesen sein.“ (V. 14 f.), der Schrägstrich markiert das Versende. Mehr als zwei Verse: V. 9–11. Ausgelassenes mit […], eigene Anpassungen in eckigen Klammern. Teilen sich zwei Figuren einen Vers, zählt der Vers nur einmal. Kurz zitieren und dann deuten: Erkläre jeweils, was die zitierte Formulierung für dein Argument zeigt. Zitate aneinanderzureihen ersetzt keine Analyse. Weicht deine Schulausgabe in Schreibung oder Verszahl ab, gilt die Schulausgabe."},{"titel":"Der Abend vorher","text":"Zitate-Trainer einmal durch, bis alle 15 sicher sind. Die acht Klausur-Stellen laut lesen: wer, wo, warum. Beispielaufgabe: nur die Gliederung aus dem Kopf aufschreiben. Zu den drei Motiven Schuld, Wahrheit und Recht je eine Stelle mit Vers parat haben."}],"eltern":{"titel":"Ihr Kind liest das Original und kann es in der Klausur belegen.","text":"Der zerbrochne Krug im Wortlaut von Kleist, Vers für Vers, mit Bildern erzählt. Jede Sprechblase trägt ihre Versnummer nach der Reclam-Ausgabe, damit in der Klausur richtig zitiert wird.","abistoff":"Der zerbrochne Krug ist ländergemeinsame Pflichtlektüre für das Abitur 2026 bis 2028, unter anderem in Bayern, Baden-Württemberg, Hessen und Nordrhein-Westfalen.","paket":["Ein Schild „Klausur“ an den Stellen, die in Klausuren drankommen","Klausurfragen mit Musterlösung nach jeder Folge","Zitate-Trainer mit Versangaben","Fahrplan: Aufgabenarten, gelöste Beispielaufgabe, Fachbegriffe","Musterklausur im Abi-Format mit Erwartungshorizont"]},"musterklausur":{"titel":"Musterklausur Folge 1","hinweis":"Eigene Übungsklausur im Stil des Abiturs, keine Originalaufgabe. Zeit wie eine Schulklausur: 90 Minuten. Hilfsmittel: Wörterbuch der deutschen Rechtschreibung.","material":{"titel":"1. Auftritt, V. 1–30","bloecke":[{"wer":"Licht","von":1,"bis":2,"zeilen":["Ei, was zum Henker, sagt, Gevatter Adam!","Was ist mit Euch geschehn? Wie seht Ihr aus?"]},{"wer":"Adam","von":3,"bis":6,"zeilen":["Ja, seht. Zum Straucheln brauchts doch nichts als Füße.","Auf diesem glatten Boden, ist ein Strauch hier?","Gestrauchelt bin ich hier; denn jeder trägt","Den leid'gen Stein zum Anstoß in sich selbst."]},{"wer":"Licht","von":7,"bis":7,"zeilen":["Nein, sagt mir, Freund! Den Stein trüg jeglicher--?"]},{"wer":"Adam","von":8,"bis":8,"zeilen":["Ja, in sich selbst!"]},{"wer":"Licht","von":8,"bis":8,"zeilen":["Verflucht das!"]},{"wer":"Adam","von":8,"bis":8,"zeilen":["Was beliebt?"]},{"wer":"Licht","von":9,"bis":12,"zeilen":["Ihr stammt von einem lockern Ältervater,","Der so beim Anbeginn der Dinge fiel,","Und wegen seines Falls berühmt geworden;","Ihr seid doch nicht--?"]},{"wer":"Adam","von":12,"bis":12,"zeilen":["Nun?"]},{"wer":"Licht","von":12,"bis":12,"zeilen":["Gleichfalls--?"]},{"wer":"Adam","von":12,"bis":13,"zeilen":["Ob ich--? Ich glaube--!","Hier bin ich hingefallen, sag ich Euch."]},{"wer":"Licht","von":14,"bis":14,"zeilen":["Unbildlich hingeschlagen?"]},{"wer":"Adam","von":14,"bis":15,"zeilen":["Ja, unbildlich.","Es mag ein schlechtes Bild gewesen sein."]},{"wer":"Licht","von":16,"bis":16,"zeilen":["Wann trug sich die Begebenheit denn zu?"]},{"wer":"Adam","von":17,"bis":21,"zeilen":["Jetzt, in dem Augenblick, da ich dem Bett","Entsteig. Ich hatte noch das Morgenlied","Im Mund, da stolpr ich in den Morgen schon,","Und eh ich noch den Lauf des Tags beginne,","Renkt unser Herrgott mir den Fuß schon aus."]},{"wer":"Licht","von":22,"bis":22,"zeilen":["Und wohl den linken obenein?"]},{"wer":"Adam","von":22,"bis":22,"zeilen":["Den linken?"]},{"wer":"Licht","von":23,"bis":23,"zeilen":["Hier, den gesetzten?"]},{"wer":"Adam","von":23,"bis":23,"zeilen":["Freilich!"]},{"wer":"Licht","von":23,"bis":24,"zeilen":["Allgerechter!","Der ohnehin schwer den Weg der Sünde wandelt?"]},{"wer":"Adam","von":25,"bis":25,"zeilen":["Der Fuß! Was? Schwer! Warum?"]},{"wer":"Licht","von":25,"bis":25,"zeilen":["Der Klumpfuß?"]},{"wer":"Adam","von":25,"bis":26,"zeilen":["Klumpfuß!","Ein Fuß ist, wie der andere, ein Klumpen."]},{"wer":"Licht","von":27,"bis":29,"zeilen":["Erlaubt! Da tut Ihr Eurem rechten unrecht.","Der rechte kann sich dieser--Wucht nicht rühmen,","Und wagt sich ehr aufs Schlüpfrige."]},{"wer":"Adam","von":29,"bis":30,"zeilen":["Ach, was!","Wo sich der eine hinwagt, folgt der andre."]}]},"aufgaben":[{"nr":1,"gewicht":"ca. 60 %","text":"Ordnen Sie den Auszug in den Zusammenhang des Dramas ein. Interpretieren Sie ihn im Hinblick darauf, wie Adams Sturz gedeutet wird."},{"nr":2,"gewicht":"ca. 40 %","text":"Vergleichen Sie Adams Erklärung im Auszug mit seinem Verhalten gegenüber der Magd im 2. Auftritt (V. 219–246). Beziehen Sie dabei das Motiv der Wahrheit ein."}],"erwartung":[{"nr":1,"punkte":["Einordnung: Beginn des Stücks (Exposition), Gerichtsstube in Huisum am frühen Morgen. Noch weiß niemand vom Prozess, Licht trifft Adam verletzt an.","Adams erste Erklärung spielt den Sturz herunter: „Zum Straucheln brauchts doch nichts als Füße.“ (V. 3).","Schuld ohne Anklage: „denn jeder trägt / Den leid'gen Stein zum Anstoß in sich selbst.“ (V. 5 f.). Der „Stein des Anstoßes“ ist ein biblisches Bild für Sünde.","Licht deutet den Namen Adam und spielt auf den Sündenfall an (V. 9–11). Adam weicht in Gedankenstrichen aus: „Ob ich--? Ich glaube--!“ (V. 12).","Wortspiel: „Unbildlich hingeschlagen?“ (V. 14) gegen „Es mag ein schlechtes Bild gewesen sein.“ (V. 15). „Fall“ ist Sturz und Sünde zugleich.","Zeitangabe und Schuldverschiebung: Adam sei gestürzt, „da ich dem Bett / Entsteig“ (V. 17 f.), und „Renkt unser Herrgott mir den Fuß schon aus.“ (V. 21).","Der Klumpfuß als Zeichen: „Der ohnehin schwer den Weg der Sünde wandelt?“ (V. 24); Adam nimmt es wörtlich: „Ein Fuß ist, wie der andere, ein Klumpen.“ (V. 26).","Form: Blankvers, geteilte Verse (V. 8, 12, 23, 25) und schnelle Wechsel. Das Tempo zeigt Lichts Nachbohren und Adams Abwehr.","Deutung: Die Exposition legt das Motiv Schuld fest. Das Publikum ahnt mehr, als Adam zugibt; daraus entsteht die Komik.","Sprache und Form: Der Auszug hat drei Schritte: der Sturz allgemein (V. 1–8), die Deutung als Sündenfall (V. 9–15), die Einzelheiten Zeit und Fuß (V. 16–30). Licht wird von Schritt zu Schritt genauer, Adam einsilbiger: „Den linken?“ (V. 22), „Freilich!“ (V. 23).","Sprache und Form: Lichts Ton ist gespielt fromm: „Allgerechter!“ (V. 23). Im Ausruf steckt das Wort „gerecht“, und das vor einem Richter. Am Ende wird er zweideutig: Der rechte Fuß „wagt sich ehr aufs Schlüpfrige“ (V. 29). Licht deutet ein Liebesabenteuer an, ohne es auszusprechen.","Kontext: Biblische Vorlagen sind der Sündenfall (1. Mose 3) und der „Stein des Anstoßes“ (Jesaja 8,14). Der Klumpfuß ruft den Pferdefuß des Teufels auf und den Namen Ödipus („Schwellfuß“). Als analytisches Drama folgt das Stück dem Bau des „König Ödipus“ von Sophokles, nur als Komödie.","Für 13 bis 15 Punkte: Zeigen, wie Adam die Schuld weiterreicht: an die Füße (V. 3), an alle Menschen (V. 5 f.), an Gott (V. 21). Er ist nie selbst der Handelnde. Und die Doppelrolle der Sprache benennen: Jeder Satz, der entlasten soll, belastet. Wer außerdem fragt, warum Licht stichelt statt offen zu fragen (Rang, eigener Ehrgeiz, Lust am Spiel), und sich mit Gründen entscheidet, liefert ein eigenes Urteil.","Häufiger Fehler: Bei der Einordnung das ganze Stück erzählen. Für den Anfang genügen drei Sätze: Ort, Figuren, Lage. Und: die geteilten Verse nur nennen, ohne ihre Wirkung (Tempo, Verhör) zu deuten."]},{"nr":2,"punkte":["Im Auszug: Adam nennt den Morgen als Zeitpunkt (V. 17 f.) und bleibt im Ungefähren.","Gegenüber der Magd: Sie nennt „Gestern abend--“ (V. 221) und „Glock elf--“ (V. 222), Adam kam „ohne die Perück ins Haus“ (V. 223), mit Blut am Kopf (V. 230).","Adam bestreitet grob: „Halts Maul, sag ich, es ist kein wahres Wort.“ (V. 232), und trennt: „Die Wunde heut und gestern die Perücke.“ (V. 234).","Dann erfindet er eine neue Geschichte mit vielen Einzelheiten: die Katze, die in der Perücke „Gejungt“ habe (V. 243), „Fünf Junge, gelb und schwarz, und eins ist weiß.“ (V. 246).","Gemeinsam: Adam weicht aus und schiebt die Ursache auf andere (Herrgott, Ziegenbock, Katze). Unterschied: Gegenüber Licht spielt er mit Worten, gegenüber der Magd setzt er auf Befehl und Einschüchterung.","Urteil: Die Wahrheit kommt in Folge 1 nicht durch Adam ans Licht, sondern durch Widersprüche und Zeugen. Genau so funktioniert später der Prozess.","Sprache und Form: Gegenüber Licht bleibt Adam beim Wortspiel. Gegenüber der Magd zerfällt seine Rede in Schimpfwörter und Befehle: „Die Unverschämte!“ (V. 231), „Scher dich zum Satan, wo du hingehörst!“ (V. 239). Die Magd spricht stockend und genau; die Gedankenstriche in V. 221 f. zeigen ihr Zögern vor dem Dienstherrn.","Machtgefälle: Licht ist beinahe gleichgestellt und wird umworben (V. 128–131), die Magd ist abhängig und wird zum Schweigen gebracht (V. 232, V. 239 f.). Adams Umgang mit der Wahrheit richtet sich nach dem Rang des Gegenübers.","Kontext: Zeugin gegen Richter. Die Szene nimmt den Prozess im Kleinen vorweg: Auch dort stehen einfache Leute mit genauen Angaben einem Richter gegenüber, der Aussagen lenkt und abschneidet (Ausblick).","Für 13 bis 15 Punkte: Den Widerspruch genau benennen statt nur behaupten: Nach V. 17–19 geschah der Sturz am Morgen, nach V. 228–230 kam Adam schon nachts blutend heim. Mit V. 234 trennt Adam Wunde und Perücke. Eine sehr gute Arbeit zeigt, dass das die erste Geschichte rettet, aber eine neue Frage aufwirft: Wo blieb die Perücke? Und sie gewichtet: Die Magd hat keinen Grund zu lügen, Adam jeden.","Häufiger Fehler: Nur Unterschiede oder nur Gemeinsamkeiten nennen. Ein Vergleich braucht beides und am Ende ein Ergebnis. Und: V. 219–246 nacherzählen, ohne auf den Auszug zurückzukommen."]}],"darstellung":["Klare Gliederung: Einleitung mit Deutungshypothese, Hauptteil, Schluss mit Ergebnis","Fachbegriffe sicher verwendet (Exposition, Blankvers, geteilter Vers, Anspielung, Wortspiel)","Kurze, korrekte Zitate mit Versangabe, jedes mit einem Satz Deutung","Eigene Sätze statt Nacherzählung","Rechtschreibung und Zeichensetzung"],"selbstcheck":["Ich habe den Auszug eingeordnet (Beginn, Gerichtsstube, Licht und Adam allein).","Ich habe die Anspielungen auf den Sündenfall belegt (V. 5 f., V. 9–11).","Ich habe das Wortspiel mit „Fall“ und „Bild“ erklärt (V. 14 f.).","Ich habe mindestens ein Formmerkmal gedeutet (Blankvers, geteilte Verse, Gedankenstriche).","Ich habe in Aufgabe 2 mindestens eine Gemeinsamkeit und zwei Unterschiede mit Versen belegt.","Ich habe am Ende ein eigenes Urteil zum Motiv Wahrheit formuliert."]}}}],"titelseite":{"bild":"hoch/titel-start.webp","video":"videos/titel.mp4","ende":"hoch/titel-end.webp","alt":"Ein alter bemalter Krug im Lichtkegel auf dem Fensterbrett, dahinter im Dunkeln das Grinsen von Dorfrichter Adam","oben":"Heinrich von Kleist","titel_aria":"Der zerbrochne Krug","zeilen":[{"text":"Der","art":"klein"},{"text":"Zerbrochne","art":"bruch"},{"text":"Krug","art":"gross"}],"unterzeile":"Ein Krug ist kaputt. Der Richter soll den Täter finden. Blöd nur, was er selbst letzte Nacht gemacht hat.","knopf":"Folge 1 lesen","moment_ms":920,"ende_ms":2200,"atmen_ms":2900,"blitz":true,"ton":{"datei":"ton/titel-paukenschlag-beecham.mp3","lautstaerke":0.85,"quelle":"Haydn, Sinfonie Nr. 94 G-Dur „mit dem Paukenschlag“, 2. Satz (Andante). Aufnahme: Royal Philharmonic Orchestra, Sir Thomas Beecham, 1958 (Capitol GCR 7127). In der EU gemeinfrei (Aufnahme von vor 1963), in den USA noch geschü
