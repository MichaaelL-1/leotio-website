<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow, noarchive, nosnippet, noimageindex">
<meta name="referrer" content="no-referrer">
<title>Lesen</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Anton&family=Crimson+Pro:ital,wght@0,500;0,600;1,500&display=swap">
<style>
/* Layout: eine Karte je Bildschirm, vertikal einrastend; das Bild füllt die Karte, Sprechblasen liegen im ruhigen unteren Bildteil. */
:root{
  color-scheme: dark;
  --ink:#0b0b0d; --paper:#fbfaf6; --line:#111; --dim:#b9b9c2; --note:#ffe45c; --pop:#ff3b30; --heute:#e9edf2;
  --kleist:"Crimson Pro", Georgia, "Times New Roman", serif;
  --sfx:"Anton", Impact, "Arial Narrow Bold", sans-serif;
  --ui: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
}
[hidden]{display:none!important}
html,body{height:100%}
body{background:var(--ink);color:var(--paper);font-family:var(--ui);overflow:hidden}
#feed{height:100%;overflow:hidden;touch-action:none;overscroll-behavior:none}
#feed::-webkit-scrollbar{display:none}
#feed:focus-visible{outline:2px solid var(--note);outline-offset:-2px}
.card{position:relative;height:100%;display:flex;justify-content:center;overflow:hidden;background:#000}
/* Sparmodus (seit 2026-11-16 zu): Karten außerhalb des Bildschirms rechnet der Browser nicht mit; das Blatt hat sonst alle Karten des Buchs (Faust: über 16.000 Elemente) und das Blättern ruckelt auf dem iPhone */
.card{content-visibility:auto;contain-intrinsic-size:auto 100vh}
.stage{position:relative;height:100%;width:100%;max-width:calc(100dvh * 9 / 16);overflow:hidden;background:#fff;cursor:pointer}
.pic{position:absolute;inset:0;will-change:transform}
.pic img{display:block;width:100%;height:100%;object-fit:cover}
/* Überstand: Das Bild ist 8 % größer als der Bildschirm, damit Wackeln, Treiben und Drehen nie einen Rand zeigen */
.card:not([data-k="0"]):not([data-k="p"]):not([data-vid]) .pic>img,.card:not([data-k="0"]):not([data-k="p"]):not([data-vid]) .pic>.lay{scale:1.08}
canvas.fx{position:absolute;inset:0;width:100%;height:100%;mix-blend-mode:multiply;pointer-events:none}
.breath{position:absolute;inset:0;background-size:cover;background-position:center;transform-origin:50% 66%;
  -webkit-mask-image:radial-gradient(ellipse 30% 9% at 52% 60%, #000 55%, transparent 100%);
          mask-image:radial-gradient(ellipse 30% 9% at 52% 60%, #000 55%, transparent 100%)}
.zzz{position:absolute;left:62%;top:50%;font-family:var(--sfx);color:#111;font-size:clamp(20px,6vw,34px);-webkit-text-stroke:4px #fff;paint-order:stroke fill;opacity:0}
.talk{position:absolute;left:0;right:0;bottom:calc(env(safe-area-inset-bottom, 0px) + 44px);display:flex;flex-direction:column;gap:10px;padding:0 max(14px, env(safe-area-inset-left, 0px))}
.bub{position:relative;align-self:flex-start;max-width:min(88%,26em);margin:0;background:var(--paper);color:#111;border:3px solid var(--line);border-radius:22px;padding:10px 15px;font-family:var(--kleist);font-weight:500;font-size:clamp(16px,4.4vw,19px);line-height:1.26;text-wrap:balance;transform-origin:20% 100%;box-shadow:0 3px 0 #0003}
.bub.r{align-self:flex-end;transform-origin:80% 100%}
/* kein Zipfel (Michael 15.11.): die Blase steht auf der Seite, auf der die Figur im Bild steht (seite), der Name sagt, wer spricht */
.bub .who{display:block;font-family:var(--ui);font-size:10.5px;font-weight:600;letter-spacing:.08em;text-transform:uppercase;color:#666;margin-bottom:1px}
.bub.heute{font-family:var(--ui);font-size:clamp(15px,4vw,17.5px);line-height:1.32;background:var(--heute);border-width:2px;border-color:#5b6470}
.note{align-self:flex-start;margin:0;background:var(--note);color:#111;font-size:13px;line-height:1.35;padding:6px 10px;border-radius:4px;transform:rotate(-1.5deg);max-width:88%}
body.nomerke .note{display:none}
/* Pur (Michael 15.11.): nur Bild und Originaltext. Weg sind Merksätze, Klausur-Schilder und -Knöpfe, das Umschalten auf Heute und die Kurzfassungen; Klausur-Paket-Seiten werden überblättert */
body.pur .note,body.pur .km,body.pur .br-km,body.pur #kpgo,body.pur #kpback,body.pur #mode,body.pur #merke,body.pur .flip,body.pur .br-tabs,body.pur .br-seen{display:none!important}
body.pur .card[data-k="k"]:not(.zeig),body.pur .card[data-k="p"]:not(.zeig){visibility:hidden}
body.pur .bub[data-heute]{cursor:default}
body.pur .menu li:has([data-go="notes"]){display:none}
body.pur #s-mode,body.pur #s-merke{opacity:.35;pointer-events:none}
.wait{visibility:hidden}
.talk>.wait{order:-1}   /* wartende Schritte halten ihren Platz oben frei: was sichtbar ist, steht immer ganz unten, Neues kommt unten dazu */
.hint{position:absolute;left:0;right:0;bottom:calc(env(safe-area-inset-bottom, 0px) + 12px);text-align:center;font-size:12px;font-weight:600;letter-spacing:.04em;color:#fff;text-shadow:0 1px 3px #000,0 0 8px #000;pointer-events:none}
.hint span{display:inline-block;animation:nudge 1.4s ease-in-out infinite}
@keyframes nudge{50%{transform:translateY(-5px)}}
@media (prefers-reduced-motion: reduce){.hint span{animation:none}}
.bub[data-heute]{cursor:pointer;min-width:9.5em;max-width:min(94%,26em)}
.bub .flip{position:absolute;right:10px;top:5px;font:600 13px var(--ui);color:#999}
.bub{-webkit-touch-callout:none;-webkit-user-select:none;user-select:none}
.bub .mark{position:absolute;right:36px;top:-3px;width:11px;height:19px;background:var(--pop);clip-path:polygon(0 0,100% 0,100% 100%,50% 74%,0 100%);transform:scaleY(0);transform-origin:50% 0;transition:transform .22s cubic-bezier(.2,.9,.3,1.4)}
.bub.saved .mark{transform:none}
#tip{position:fixed;left:50%;top:calc(66px + env(safe-area-inset-top));transform:translateX(-50%);z-index:30;background:#111e;color:#fff;font:500 13px var(--ui);padding:9px 14px;border-radius:999px;border:1px solid #fff3;pointer-events:none;opacity:0;transition:opacity .3s;white-space:nowrap}
#tip.on{opacity:1}
#kpback{position:fixed;right:max(calc(50% - 50dvh * 9 / 16 + 12px), calc(12px + env(safe-area-inset-right, 0px)));top:calc(104px + env(safe-area-inset-top));z-index:7;font:800 15px var(--ui);color:#fff;background:var(--pop);border:2px solid #fff;border-radius:999px;padding:11px 18px;min-height:46px;box-shadow:0 6px 20px #000b;cursor:pointer;white-space:nowrap}
#kpback:not([hidden]){animation:kpin .35s cubic-bezier(.2,.9,.3,1.3)}
@keyframes kpin{from{opacity:0;transform:translateX(30px)}}
#kpback:active{transform:scale(.95)}
#sheet{position:fixed;inset:0;z-index:20;background:rgba(0,0,0,.55);display:flex;justify-content:center;align-items:flex-end}
#sheet .box{width:100%;max-width:calc(100dvh * 9 / 16);max-height:88%;overflow-y:auto;background:#17171b;color:var(--paper);border-radius:22px 22px 0 0;padding:10px 18px calc(env(safe-area-inset-bottom, 0px) + 22px);box-shadow:0 -10px 40px #000a}
#sheet .bar{display:flex;align-items:center;justify-content:space-between;gap:10px;position:sticky;top:-10px;z-index:3;background:#17171b;padding:12px 0 8px;margin-bottom:4px}
#sheet h2{margin:0;font:400 22px var(--sfx);font-style:italic;letter-spacing:.02em;text-transform:uppercase}
#sheet .x,#sheet .back{font:600 13px var(--ui);color:var(--paper);background:rgba(255,255,255,.1);border:0;border-radius:999px;padding:7px 12px;cursor:pointer}
#sheet button:focus-visible{outline:2px solid var(--note);outline-offset:2px}
.menu{list-style:none;margin:0;padding:0}
.menu li{border-top:1px solid rgba(255,255,255,.1)}
.menu button{display:flex;width:100%;align-items:baseline;justify-content:space-between;gap:12px;text-align:left;background:none;border:0;color:var(--paper);font:500 16px var(--ui);padding:14px 2px;cursor:pointer}
.menu button small{font-size:12.5px;color:var(--dim);font-weight:400;text-align:right}
.menu button[disabled]{cursor:default;color:var(--dim)}
.sw{display:flex;align-items:center;justify-content:space-between;gap:12px;font-size:14px;color:var(--dim);padding:6px 0 14px}
.sw button{font:600 12px var(--ui);border-radius:999px;border:1px solid rgba(255,255,255,.3);background:none;color:var(--paper);padding:6px 12px;cursor:pointer;white-space:nowrap}
.sw button[aria-pressed="true"]{background:var(--note);color:#111;border-color:var(--note)}
.figs{display:grid;grid-template-columns:repeat(3,1fr);gap:14px 10px;list-style:none;margin:0;padding:0}
.figs button{display:block;width:100%;background:none;border:0;color:var(--paper);font:600 13px var(--ui);cursor:pointer;padding:0;text-align:center}
.figs img{display:block;width:100%;aspect-ratio:1;object-fit:cover;border-radius:50%;border:3px solid var(--paper);background:#fff;margin-bottom:6px}
.figs small{display:block;font-weight:400;font-size:11.5px;color:var(--dim);margin-top:1px}
.figs .later img{filter:brightness(.25) blur(3px);border-color:#555}
.rows{list-style:none;margin:0;padding:0}
.rows li{border-top:1px solid rgba(255,255,255,.1)}
.rows button{display:block;width:100%;text-align:left;background:none;border:0;color:var(--paper);font:500 15.5px/1.35 var(--ui);padding:12px 2px;cursor:pointer}
.rows button small{display:block;font-size:12px;color:var(--dim);font-weight:400;margin-bottom:2px;letter-spacing:.04em;text-transform:uppercase}
.rows li.now button{color:var(--note)}
.rows li.empty{color:var(--dim);font-size:14px;padding:14px 2px;border:0}
.set{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:12px 0;border-top:1px solid rgba(255,255,255,.1);font:500 15.5px var(--ui)}
.seg{display:flex;background:rgba(255,255,255,.1);border-radius:999px;padding:3px}
.seg button{font:600 13px var(--ui);color:var(--paper);background:none;border:0;border-radius:999px;padding:7px 13px;cursor:pointer}
.seg button[aria-pressed="true"]{background:var(--paper);color:#111}
.fine{font-size:12.5px;color:var(--dim);margin:10px 0 0}
#fig-body2 p{font-size:14.5px;line-height:1.45;margin:0 0 6px}
.bub,.note,.cap{zoom:var(--bs,1)}
.prof{display:flex;gap:14px;align-items:center;margin-bottom:12px}
.prof img{width:92px;height:92px;border-radius:50%;object-fit:cover;border:3px solid var(--paper);background:#fff;flex:none}
.prof b{display:block;font:400 26px var(--sfx);font-style:italic;text-transform:uppercase}
.prof span{font-size:13.5px;color:var(--dim)}
#fig-body p{font-size:15px;line-height:1.45;margin:0 0 10px}
#fig-body h3,#fig-body2 h3{font:700 11px var(--ui);letter-spacing:.1em;text-transform:uppercase;color:var(--dim);margin:16px 0 6px}
#fig-body blockquote{margin:0 0 10px;padding:8px 12px;border-left:3px solid var(--pop);font:500 16px/1.3 var(--kleist);background:rgba(255,255,255,.05)}
#fig-body .lock{font-size:13.5px;color:var(--dim);border:1px dashed rgba(255,255,255,.25);border-radius:10px;padding:10px 12px}

/* Leiste oben: Fortschritt in Segmenten, darunter Szene links und drei Bedienelemente rechts */
.stage{container-type:inline-size}
.shade{position:absolute;left:0;right:0;top:0;height:22%;background:linear-gradient(#000c,#0006 45%,#0000);pointer-events:none}
#top{position:fixed;z-index:6;top:0;left:0;right:0;display:flex;justify-content:center;pointer-events:none}
#top .in{width:100%;max-width:calc(100dvh * 9 / 16);padding:calc(env(safe-area-inset-top, 0px) + 8px) max(12px, env(safe-area-inset-right, 0px)) 0 max(12px, env(safe-area-inset-left, 0px))}
#segs{display:flex;gap:4px;transition:opacity .3s}
#segs i{flex:1;height:3px;border-radius:2px;background:rgba(255,255,255,.3);transition:background .3s}
#segs i.done{background:#fff}
#segs i.now{background:var(--pop)}
#top .row{display:flex;flex-wrap:wrap;align-items:center;gap:5px 8px;margin-top:7px}
#top .t1{flex:0 0 100%;min-width:0;display:flex;align-items:center;gap:8px;min-height:24px}
#top .ttl{flex:1 1 0;min-width:0;transition:opacity .3s;text-shadow:0 1px 4px #000}   /* eigene kleine Zeile über den Knöpfen: so wird sie auch auf schmalen Telefonen nie abgeschnitten */
#top .ttl small{display:block;font:700 10px var(--ui);letter-spacing:.08em;text-transform:uppercase;color:#fff;opacity:.85;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#top .ttl b{display:none}   /* der Folgentitel steht nur in der Seitenübersicht */
#mode{margin-left:auto}
/* Klausur-Paket der Folge: von jeder Seite aus ein Tipp entfernt, rot wie das Klausur-Schild (dafür wird gezahlt) */
#kpgo{position:relative;flex:none;font:800 10.5px var(--ui);letter-spacing:.08em;text-transform:uppercase;color:#fff;background:var(--pop);border:0;border-radius:999px;padding:6px 11px;box-shadow:0 1px 6px #0008;transition:opacity .3s}
#kpgo::after{content:"";position:absolute;inset:-9px -6px}
#kpgo:active{transform:scale(.94)}
#vz[aria-pressed="true"]{color:#fff;background:var(--pop)}
.neu{position:absolute;z-index:4;left:max(10px, env(safe-area-inset-left, 0px));bottom:calc(env(safe-area-inset-bottom, 0px) + 5px);font:700 12px var(--ui);letter-spacing:.02em;color:#fff;background:rgba(18,18,22,.6);-webkit-backdrop-filter:blur(10px);backdrop-filter:blur(10px);box-shadow:inset 0 0 0 1px rgba(255,255,255,.28);border:0;border-radius:999px;padding:7px 12px;cursor:pointer}
.neu:active{transform:scale(.94)}
.neu:focus-visible{outline:2px solid var(--note);outline-offset:2px}
.bub.spricht{box-shadow:0 0 0 2.5px var(--pop),0 2px 10px #0006}
body.oncover #kpgo{opacity:0;pointer-events:none}
#top button{pointer-events:auto;cursor:pointer}
#mode{position:relative;display:flex;flex:none;border-radius:999px;background:rgba(18,18,22,.55);-webkit-backdrop-filter:blur(12px) saturate(1.4);backdrop-filter:blur(12px) saturate(1.4);box-shadow:inset 0 0 0 1px rgba(255,255,255,.22);padding:3px;transition:opacity .3s}
#mode::before{content:"";position:absolute;top:3px;bottom:3px;left:3px;width:calc(50% - 3px);border-radius:999px;background:var(--paper);transition:transform .25s cubic-bezier(.3,.8,.3,1.2), background .25s}
#mode[data-m="heute"]::before{transform:translateX(100%);background:var(--heute)}
#mode button{position:relative;width:56px;font:700 11.5px var(--ui);letter-spacing:.03em;color:#fff;background:none;border:0;padding:6px 0;border-radius:999px;transition:color .2s}
#mode button[aria-pressed="true"]{color:#111}
.ic{flex:none;width:34px;height:34px;border-radius:50%;border:0;display:grid;place-items:center;color:#fff;background:rgba(18,18,22,.55);-webkit-backdrop-filter:blur(12px) saturate(1.4);backdrop-filter:blur(12px) saturate(1.4);box-shadow:inset 0 0 0 1px rgba(255,255,255,.22);transition:background .2s,color .2s,transform .15s,opacity .3s}
.ic:active{transform:scale(.9)}
.ic svg{width:18px;height:18px;display:block}
#merke[aria-pressed="true"]{background:var(--note);color:#111;box-shadow:none}
#top button:focus-visible{outline:2px solid var(--note);outline-offset:2px}
body.oncover #segs,body.oncover #top .ttl,body.oncover #mode,body.oncover #merke,body.onbridge #mode{opacity:0;pointer-events:none}   /* auf Brücken wählt man die Fassung an den Reitern der Seite */
@media (prefers-reduced-motion: reduce){#mode::before{transition:none}}
#top .ttl{pointer-events:auto;cursor:pointer}
#segs{pointer-events:auto;cursor:pointer;padding:6px 0;margin:-6px 0}
#fb.ic{color:#111;background:#fff;box-shadow:0 2px 10px #0008;width:auto;min-width:34px;padding:0 12px 0 9px;display:flex;align-items:center;gap:5px;border-radius:999px;font:800 12.5px var(--ui);letter-spacing:.02em}
#fb.ic svg{width:17px;height:17px}
@media (max-width:379px){#fb.ic span{display:none} #fb.ic{padding:0;width:34px;justify-content:center}}
.fb-bar{position:sticky;bottom:0;margin:0 -2px;padding:16px 2px calc(env(safe-area-inset-bottom, 0px) + 6px);background:linear-gradient(rgba(38,38,44,0),#26262c 26%)}
.fb-bar .fb-send{margin:0}
.fb-send.off{opacity:.45}
.tst-st{display:flex;gap:6px;margin:0 0 12px}
.tst-st button{flex:1;font-size:34px;line-height:1;padding:10px 0;color:#fff;background:rgba(255,255,255,.12);border:0;border-radius:14px;cursor:pointer}
.tst-st button:active{background:var(--pop)}
.tst-go{display:block;width:100%;font:700 16px var(--ui);color:#111;background:var(--paper);border:0;border-radius:999px;padding:14px;cursor:pointer}
.tst-fine{margin:10px 0 0;font:500 13px/1.4 var(--ui);color:#bbb;text-align:center}

/* Übersicht: alle Karten als kleine Bilder, ein Tippen springt hin */
.ov-h{margin:16px 2px 8px;font:700 11.5px var(--ui);letter-spacing:.12em;text-transform:uppercase;color:var(--dim)}
.ov{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;list-style:none;margin:0;padding:0}
.ov button{position:relative;display:block;width:100%;aspect-ratio:9/16;padding:0;border:0;border-radius:7px;overflow:hidden;background:#000;cursor:pointer}
.ov img{width:100%;height:100%;object-fit:cover;display:block}
.ov .b img{filter:brightness(.35)}
.ov .b span{position:absolute;inset:0;display:grid;place-items:center;padding:4px;font:700 9.5px/1.2 var(--ui);color:#fff;text-align:center;letter-spacing:.04em}
.ov i{position:absolute;left:4px;bottom:3px;font:700 10px var(--ui);font-style:normal;color:#fff;text-shadow:0 1px 3px #000}
.ov .now button{outline:3px solid var(--pop);outline-offset:-3px}
.ov .seen button::after{content:"";position:absolute;right:4px;top:4px;width:7px;height:7px;border-radius:50%;background:#fff;box-shadow:0 0 3px #000}
/* Register: alle Folgen als Reihe von Zahlen, haftet oben in der Übersicht; Tippen blättert die Übersicht zur Folge */
.ov-reg{position:sticky;top:36px;z-index:2;display:flex;align-items:center;gap:6px;margin:0 -18px 2px;padding:8px 18px 10px;background:linear-gradient(#17171b 80%,#17171b00);overflow-x:auto;scrollbar-width:none;touch-action:pan-x;-webkit-overflow-scrolling:touch}
.ov-reg::-webkit-scrollbar{display:none}
.ov-reg>span{flex:none;font:700 11.5px var(--ui);letter-spacing:.12em;text-transform:uppercase;color:var(--dim);margin-right:4px}
.ov-reg button{position:relative;flex:none;width:36px;height:36px;border-radius:50%;border:0;font:700 14.5px var(--ui);color:var(--paper);background:rgba(255,255,255,.1);box-shadow:inset 0 0 0 1px rgba(255,255,255,.16);cursor:pointer;transition:background .2s,color .2s,transform .2s}
.ov-reg button.on{background:var(--paper);color:#111;transform:scale(1.08)}
.ov-reg button.hier::after{content:"";position:absolute;left:50%;bottom:-6px;width:5px;height:5px;margin-left:-2.5px;border-radius:50%;background:var(--pop)}
.ov-reg button.vs{box-shadow:none;border:1.5px dashed rgba(255,255,255,.5)}
.ov-reg button.zu{color:#fff6;background:none;box-shadow:inset 0 0 0 1px rgba(255,255,255,.12)}
.ov-reg button:focus-visible{outline:2px solid var(--note);outline-offset:2px}
.ov-h[data-fo]{scroll-margin-top:104px}
.ov-top{display:flex;gap:8px;flex-wrap:wrap;margin:2px 0 4px}
.ov-top button{font:600 13px var(--ui);color:var(--paper);background:rgba(255,255,255,.1);border:0;border-radius:999px;padding:8px 13px;cursor:pointer}

/* Klausur: rote Marke an Kernstellen, Paket-Seite nach der Folge */
.km{position:absolute;right:-6px;top:-12px;z-index:2;font:800 10px var(--ui);letter-spacing:.08em;text-transform:uppercase;color:#fff;background:var(--pop);border:2px solid #fff;border-radius:999px;padding:3px 8px;cursor:pointer;box-shadow:0 2px 6px #0006}
.bub.r .km{right:auto;left:-6px}
.br-km{display:inline-block;margin:6px 0 0;font:800 10.5px var(--ui);letter-spacing:.08em;text-transform:uppercase;color:#fff;background:var(--pop);border:0;border-radius:999px;padding:5px 10px;cursor:pointer}
.km-z{margin:4px 0 10px;font:500 20px/1.4 var(--kleist);color:var(--paper)}
.km-v{font:600 12px var(--ui);color:var(--dim);letter-spacing:.06em;text-transform:uppercase}
.kp-dark{position:absolute;inset:0;background:linear-gradient(#000a,#000e 40%,#000);pointer-events:none}
.kp-body{position:absolute;left:0;right:0;bottom:calc(env(safe-area-inset-bottom, 0px) + 54px);padding:0 18px;color:#fff}
.kp-kick{margin:0 0 6px;font:800 11px var(--ui);letter-spacing:.16em;text-transform:uppercase;color:#cfcfd6}
.kp-h{margin:0 0 6px;font:400 34px/1 var(--sfx);font-style:italic;text-transform:uppercase}
.kp-sub{margin:0 0 16px;font:500 15px/1.4 var(--ui);color:#ddd}
.kp-tiles{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.kp-tiles button{text-align:left;min-height:86px;font:700 16px/1.2 var(--ui);color:#111;background:var(--paper);border:0;border-radius:16px;padding:12px;cursor:pointer}
.kp-tiles button small{display:block;margin-top:6px;font:500 12.5px/1.3 var(--ui);color:#555}
.kp-tiles button.w{grid-column:1/-1;min-height:0}
.kp-tiles button.e{background:none;color:#fff;box-shadow:inset 0 0 0 2px #fff}
.kp-tiles button.e small{color:#ddd}

 Boden, ist ein Strauch hier?"}]},{"abschnitt":[7,8]},{"wer":"Licht","zeilen":[{"v":7,"t":"Nein, sagt mir, Freund!  Den Stein trüg jeglicher--?"}]},{"wer":"Adam","zeilen":[{"v":8,"t":"Ja, in sich selbst!"}]},{"wer":"Licht","zeilen":[{"v":8,"t":"Verflucht das!"}]},{"wer":"Adam","zeilen":[{"v":8,"t":"Was beliebt?"}]}]},{"id":"S2-A","abschnitt":"1. Auftritt","szene":"Der erste Adam","bild":"hoch/S2-A.webp","alt":"Licht beugt sich spöttisch zu Adam, über ihnen erscheint der Baum mit Schlange und Apfel","ebenen":null,"video":null,"einstellung":"tilt","punkte":[[50,25,1.7],[55,45,1.6]],"effekte":[],"soundwort":null,"schritte":[{"art":"blase","id":"S2-A-1","wer":"Licht","seite":"links","original":["Ihr stammt von einem lockern Ältervater,","Der so beim Anbeginn der Dinge fiel,","Und wegen seines Falls berühmt geworden;","Ihr seid doch nicht--?"],"heute":"Sie stammen von einem leichtsinnigen Urahn ab, der gleich am Anfang der Welt gefallen ist und dafür berühmt wurde. Sie sind doch nicht etwa …?","vers":[9,12],"fokus":[45,45,1.35],"audio":null},{"art":"merke","text":"Anspielung auf Adam und den Sündenfall. Der Name der Figur ist kein Zufall.","fokus":[20,68,2.0]}]},{"id":"S2-B","abschnitt":"1. Auftritt","szene":"Der erste Adam","bild":"hoch/S2-B.webp","alt":"Licht flüstert Adam etwas ins Ohr, Adam reißt erschrocken die Augen auf","ebenen":[{"art":"bg","datei":"ebenen/S2-B-bg.webp"},{"art":"mg","datei":"ebenen/S2-B-mg.webp"},{"art":"fg","datei":"ebenen/S2-B-fg.webp"}],"video":null,"einstellung":"push","punkte":[[45,45,1.3]],"effekte":[],"soundwort":null,"schritte":[{"art":"blase","id":"S2-B-1","wer":"Adam","seite":"rechts","original":["Nun?"],"heute":"Na?","vers":[12,12],"fokus":[62,45,1.6],"audio":null},{"art":"blase","id":"S2-B-2","wer":"Licht","seite":"links","original":["Gleichfalls--?"],"heute":"Auch gefallen …?","vers":[12,12],"fokus":[22,45,1.8],"audio":null},{"art":"blase","id":"S2-B-3","wer":"Adam","seite":"rechts","original":["Ob ich--? Ich glaube--!","Hier bin ich l auch noch den linken?"},{"wer":"Adam","text":"Den linken?"},{"wer":"Licht","text":"Hier, den schweren?"},{"wer":"Adam","text":"Natürlich!"},{"wer":"Licht","text":"Gerechter Gott! Den, der ohnehin schon schwer auf dem Weg der Sünde geht?"},{"wer":"Adam","text":"Der Fuß? Was? Schwer? Wieso?"}],"original":[{"wer":"Licht","zeilen":[{"v":16,"t":"Wann trug sich die Begebenheit denn zu?"}]},{"wer":"Adam","zeilen":[{"v":17,"t":"Jetzt, in dem Augenblick, da ich dem Bett"},{"v":18,"t":"Entsteig.  Ich hatte noch das Morgenlied"},{"v":19,"t":"Im Mund, da stolpr ich in den Morgen schon,"},{"v":20,"t":"Und eh ich noch den Lauf des Tags beginne,"},{"v":21,"t":"Renkt unser Herrgott mir den Fuß schon aus."}]},{"wer":"Licht","zeilen":[{"v":22,"t":"Und wohl den linken obenein?"}]},{"wer":"Adam","zeilen":[{"v":22,"t":"Den linken?"}]},{"wer":"Licht","zeilen":[{"v":23,"t":"Hier, den gesetzten?"}]},{"wer":"Adam","zeilen":[{"v":23,"t":"Freilich!"}]},{"wer":"Licht","zeilen":[{"v":23,"t":"Allgerechter!"},{"v":24,"t":"Der ohnehin schwer den Weg der Sünde wandelt?"}]},{"wer":"Adam","zeilen":[{"v":25,"t":"Der Fuß!  Was?  Schwer!  Warum?"}]}]},{"id":"S2-D","abschnitt":"1. Auftritt","szene":"Der Fuß","bild":"hoch/S2-D.webp","alt":"Unter der Robe schauen ein Schuh und ein dick verbundener Fuß hervor","ebenen":null,"video":null,"einstellung":"pan","punkte":[[15,65,1.9],[70,65,1.7]],"effekte":[],"soundwort":null,"schritte":[{"art":"blase","id":"S2-D-1","wer":"Licht","seite":"links","original":["Der Klumpfuß?"],"heute":"Der Klumpfuß?","vers":[25,25],"fokus":[70,65,1.9],"ruck":true,"audio":null},{"art":"blase","id":"S2-D-2","wer":"Adam","seite":"rechts","original":["Klumpfuß!","Ein Fuß ist, wie der andere, ein Klumpen."],"heute":"Klumpfuß! Ein Fuß ist ein Klumpen wie der andere.","vers":[25,26],"fokus":[45,62,1.25],"audio":null},{"art":"merke","text":"Der Klumpfuß erinnert an den Pferdefuß des Teufels."}]},{"id":"S2-Db","art":"bruecke","abschnitt":"1. Auftritt","szene":"Der Fuß","hintergrund":"S2-D","vers":[27,30],"titel":"Der rechte Fuß wagt mehr","kurz":"Licht widerspricht: Der rechte Fuß sei nicht so schwer und wage sich eher aufs Glatte. Adam wischt das weg: Wo der eine Fuß hingeht, folgt der andere.","merke":"„Aufs Schlüpfrige“ (V. 29) ist doppeldeutig: glatter Boden und unanständige Abenteuer. Licht deutet an, dass er mehr ahnt, als er sagt.","heute":[{"wer":"Licht","text":"Moment! Da tun Sie Ihrem rechten Fuß unrecht. Der rechte hat nicht diese … Wucht und wagt sich eher aufs Glatte."},{"wer":"Adam","text":"Ach was! Wo der eine sich hinwagt, da geht der andere mit."}],"original":[{"wer":"Licht","zeilen":[{"v":27,"t":"Erlaubt!  Da tut Ihr Eurem rechten unrecht."},{"v":28,"t":"Der rechte kann sich dieser--Wucht nicht rühmen,"},{"v":29,"t":"Und wagt sich ehr aufs Schlüpfrige."}]},{"wer":"Adam","zeilen":[{"v":29,"t":"Ach, was!"},{"v":30,"t":"Wo sich der eine hinwagt, folgt der andre."}]}]},{"id":"S3-A","abschnitt":"1. Auftritt","szene":"Das Gesicht","bild":"hoch/S3-A.webp","alt":"Licht zeigt auf Adams Gesicht, Adam fasst sich an die Wange","ebenen":null,"video":null,"einstellung":"push","punkte":[[50,43,1.3]],"effekte":[],"soundwort":null,"schritte":[{"art":"blase","id":"S3-A-1","wer":"Licht","seite":"links","original":["Und was hat das Gesicht Euch so verrenkt?"],"heute":"Und was hat Ihr Gesicht so zugerichtet?","vers":[31,31],"fokus":[35,43,1.7],"audio":null},{"art":"blase","id":"S3-A-2","wer":"Adam","seite":"rechts","original":["Mir das Gesicht?"],"heute":"Mein Gesicht?","vers":[32,32],"fokus":[68,43,1.8],"audio":null}]},{"id":"S3-B","abschnitt":"1. Auftritt","szene":"Das Gesicht","bild":"hoch/S3-B.webp","alt":"Licht hält sich im Dunkeln die Hand vor den Mund und grinst","ebenen":null,"video":null,"einstellung":"creep","punkte":[[50,45,1.22]],"effekte":["shiver"],"soundwort":null,"schritte":[{"art":"blase","id":"S3-B-1","wer":"Licht","seite":"links","original":["Geschunden ists,","Ein Greul zu sehn. Ein Stück fehlt von der Wange,"],"heute":"Es ist zerschunden, schrecklich anzusehen. Von der Wange fehlt ein Stück.","vers":[35,36],"fokus":null,"audio":null}]},{"id":"S3-C","abschnitt":"1. Auftritt","szene":"Das Gesicht","bild":"hoch/S3-C.webp","alt":"Licht hält Adam einen Spiegel hin, darin Adams zerschundenes Gesicht mit blauem Auge","ebenen":[{"art":"bg","datei":"ebenen/S3-C-bg.webp"},{"art":"fg","datei":"ebenen/S3-C-fg.webp"}],"video":null,"einstellung":"push","punkte":[[50,50,1.2]],"effekte":[],"soundwort":null,"schritte":[{"art":"kasten","text":"Licht bringt einen Spiegel."},{"art":"blase","id":"S3-C-1","wer":"Licht","seite":"rechts","original":["Hier! Überzeugt Euch selbst!"],"heute":"Hier! Sehen Sie selbst!","vers":[38,38],"fokus":[80,50,1.7],"audio":null},{"art":"blase","id":"S3-C-2","wer":"Adam","seite":"links","original":["Hm! Ja! 's ist wahr.","Unlieblich sieht es aus."],"heute":"Hm. Ja. Stimmt. Schön sieht das nicht aus.","vers":[42,42],"fokus":[50,50,2.0],"ruck":true,"audio":null}]},{"id":"S3-Cb","art":"bruecke","abschnitt":"1. Auftritt","szene":"Das Gesicht","hintergrund":"S3-C","vers":[32,48],"titel":"Die Bestandsaufnahme","kurz":"Adam tut, als wisse er nichts von seinem Gesicht. Licht zählt auf, was er sieht: Von der Wange fehlt ein Stück, die Nase ist verletzt, und quer über dem Auge liegt ein blutiger Schlag, als hätte ein Knecht zugeschlagen. Adam redet jede Wunde klein und behauptet, er habe nichts davon gespürt.","merke":"Ein gehetztes Schaf verliert laut Licht nicht mehr Wolle, als Adam Fleisch verloren hat (V. 39–41). Der übertriebene Vergleich wirkt komisch und weckt Zweifel daran, dass nur ein harmloser Sturz passiert ist.","heute":[{"wer":"Adam","text":"Mein Gesicht?"},{"wer":"Licht","text":"Wie? Davon wissen Sie nichts?"},{"wer":"Adam","text":"Ich müsste ja ein Lügner sein … Wie sieht es denn aus?"},{"wer":"Licht","text":"Wie es aussieht?"},{"wer":"Adam","text":"Ja, mein Lieber."},{"wer":"Licht","text":"Abscheulich!"},{"wer":"Adam","text":"Werden Sie deutlicher."},{"wer":"Licht","text":"Es ist zerschunden, schrecklich anzusehen. Von der Wange fehlt ein Stück. Wie groß? Ohne Waage kann ich das nicht schätzen."},{"wer":"Adam","text":"Zum Teufel auch!"},{"regie":"Licht bringt einen Spiegel."},{"wer":"Licht","text":"Hier! Sehen Sie selbst! Ein Schaf, das von Hunden gehetzt durch Dornen bricht, lässt nicht mehr Wolle hängen, als Sie, Gott weiß wo, Fleisch gelassen haben."},{"wer":"Adam","text":"Hm. Ja. Stimmt. Schön sieht das nicht aus. Die Nase hat auch etwas abbekommen."},{"wer":"Licht","text":"Und das Auge."},{"wer":"Adam","text":"Das Auge nicht, mein Freund."},{"wer":"Licht","text":"Doch, hier liegt quer ein Schlag, blutig unterlaufen, Gott strafe mich, als hätte ihn ein Großknecht im Zorn geführt."},{"wer":"Adam","text":"Das ist der Augenknochen. Ja, sehen Sie, das alles hatte ich gar nicht gespürt."}],"original":[{"wer":"Adam","zeilen":[{"v":32,"t":"Mir das Gesicht?"}]},{"wer":"Licht","zeilen":[{"v":32,"t":"Wie?  Davon wißt Ihr nichts?"}]},{"wer":"Adam","zeilen":[{"v":33,"t":"Ich müßt ein Lügner sein--wie siehts denn aus?"}]},{"wer":"Licht","zeilen":[{"v":34,"t":"Wie's aussieht?"}]},{"wer":"Adam","zeilen":[{"v":34,"t":"Ja, Gevatterchen."}]},{"wer":"Licht","zeilen":[{"v":34,"t":"Abscheulich!"}]},{"wer":"Adam","zeilen":[{"v":35,"t":"Erklärt Euch deutlicher."}]},{"wer":"Licht","zeilen":[{"v":35,"t":"Geschunden ists,"},{"v":36,"t":"Ein Greul zu sehn.  Ein Stück fehlt von der Wange,"},{"v":37,"t":"Wie groß?  Nicht ohne Waage kann ichs schätzen."}]},{"wer":"Adam","zeilen":[{"v":38,"t":"Den Teufel auch!"}]},{"wer":"Licht","regie":"bringt einen Spiegel","zeilen":[{"v":38,"t":"Hier!  Überzeugt Euch selbst!"},{"v":39,"t":"Ein Schaf, das, eingehetzt von Hunden, sich"},{"v":40,"t":"Durch Dornen drängt, läßt nicht mehr Wolle sitzen,"},{"v":41,"t":"Als Ihr--Gott weiß wo?--Fleisch habt sitzen lassen."}]},{"wer":"Adam","zeilen":[{"v":42,"t":"Hm!  Ja!  's ist wahr.  Unlieblich sieht es aus."},{"v":43,"t":"Die Nas hat auch gelitten."}]},{"wer":"Licht","zeilen":[{"v":43,"t":"Und das Auge."}]},{"wer":"Adam","zeilen":[{"v":44,"t":"Das Auge nicht, Gevatter."}]},{"wer":"Licht","zeilen":[{"v":44,"t":"Ei, hier liegt"},{"v":45,"t":"Querfeld ein Schlag, blutrünstig, straf mich Gott,"},{"v":46,"t":"Als hätt ein Großknecht wütend ihn geführt."}]},{"wer":"Adam","zeilen":[{"v":47,"t":"Das ist der Augenknochen.--Ja, nun seht,"},{"v":48,"t":"Das alles hatt ich nicht einmal gespürt."}]}]},{"id":"S3-D","abschnitt":"1. Auftritt","szene":"Das Gesicht","bild":"hoch/S3-D.webp","alt":"Adam winkt am Tisch ab, Licht steht mit verschränkten Armen davor","ebenen":null,"video":null,"einstellung":"push","punkte":[[40,40,1.2]],"effekte":[],"soundwort":null,"schritte":[{"art":"blase","id":"S3-D-1","wer":"Licht","seite":"links","original":["Ja, ja! So gehts im Feuer des Gefechts."],"heute":"Ja, ja. So ist das im Eifer des Gefechts.","vers":[49,49],"fokus":[15,37,1.9],"audio":null},{"art":"blase","id":"S3-D-2","wer":"Adam","seite":"rechts","original":["Gefecht! Was?--"],"heute":"Gefecht? Was?","vers":[50,50],"fokus":[60,40,1.7],"ruck":true,"audio":null},{"art":"merke","text":"Licht stichelt mit dem Wort „Gefecht“. Adam erschrickt und braucht sofort eine Erklärung.","fokus":[40,42,1.0]}]},{"id":"S4-A","abschnitt":"1. Auftritt","szene":"Die Ausrede","bild":"hoch/S4-A.webp","alt":"Adam zeigt lachend auf den Kachelofen mit Ziegenbock-Relief, Licht hört skeptisch zu","ebenen":null,"video":null,"sonder":"ofen","einstellung":null,"punkte":null,"effekte":[],"soundwort":null,"schritte":[{"art":"blase","id":"S4-A-1","wer":"Adam","seite":"rechts","original":["Mit dem verfluchten Ziegenbock","Am Ofen focht ich, wenn Ihr wollt. Jetzt weiß ichs."],"heute":"Mit dem verfluchten Ziegenbock am Ofen habe ich gekämpft, wenn Sie so wollen. Jetzt fällt es mir wieder ein.","vers":[50,51],"fokus":null,"audio":null},{"art":"merke","text":"„Jetzt weiß ichs“ verrät, dass Adam die Erklärung gerade erst erfindet."}]},{"id":"S4-B","abschnitt":"1. Auftritt","szene":"Die Ausrede","bild":"hoch
